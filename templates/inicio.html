{% extends "base.html" %}

{% block content %}
<div class="text-center py-12 max-w-lg mx-auto">
  <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
    <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
      <i data-lucide="user-check" class="w-8 h-8"></i>
    </div>
    <h2 class="text-2xl font-extrabold text-slate-800 mb-2">Bienvenido a Huellitas</h2>
    <p class="text-sm text-slate-500 mb-6">Selecciona el módulo al que deseas ingresar:</p>
    
    <div class="grid grid-cols-2 gap-3">
      <a href="{{ url_for('rescatista') }}" class="p-4 border rounded-xl hover:border-indigo-600 hover:bg-indigo-50 text-slate-700 font-bold text-sm transition-all flex flex-col items-center gap-2">
        <i data-lucide="life-buoy" class="w-6 h-6 text-indigo-600"></i> Rescatista
      </a>
      <a href="{{ url_for('veterinario') }}" class="p-4 border rounded-xl hover:border-indigo-600 hover:bg-indigo-50 text-slate-700 font-bold text-sm transition-all flex flex-col items-center gap-2">
        <i data-lucide="stethoscope" class="w-6 h-6 text-indigo-600"></i> Veterinario
      </a>
      <a href="{{ url_for('usuario') }}" class="p-4 border rounded-xl hover:border-indigo-600 hover:bg-indigo-50 text-slate-700 font-bold text-sm transition-all flex flex-col items-center gap-2">
        <i data-lucide="users" class="w-6 h-6 text-indigo-600"></i> Usuario
      </a>
      <a href="{{ url_for('admin') }}" class="p-4 border rounded-xl hover:border-indigo-600 hover:bg-indigo-50 text-slate-700 font-bold text-sm transition-all flex flex-col items-center gap-2">
        <i data-lucide="shield" class="w-6 h-6 text-indigo-600"></i> Administrador
      </a>
    </div>
  </div>
</div>
{% endblock %}
