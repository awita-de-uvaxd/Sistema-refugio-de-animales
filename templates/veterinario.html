{% extends "base.html" %}
{% block content %}
<div class="w-full">
  <nav class="flex overflow-x-auto border-b border-slate-200 text-sm font-medium mb-6 bg-white rounded-t-xl shadow-sm scroll-hide">
    <button onclick="switchTab('veterinario', 'inicio')" class="tab-btn-veterinario px-5 py-4 border-b-2 flex active" data-tab="inicio"><i data-lucide="activity" class="w-4 h-4 mr-2"></i> Panel de Control</button>
    <button onclick="switchTab('veterinario', 'nueva')" class="tab-btn-veterinario px-5 py-4 border-b-2 flex" data-tab="nueva"><i data-lucide="stethoscope" class="w-4 h-4 mr-2"></i> Nueva Consulta</button>
    <button onclick="switchTab('veterinario', 'buscar')" class="tab-btn-veterinario px-5 py-4 border-b-2 flex" data-tab="buscar"><i data-lucide="search" class="w-4 h-4 mr-2"></i> Buscar Paciente</button>
    <button onclick="switchTab('veterinario', 'citas')" class="tab-btn-veterinario px-5 py-4 border-b-2 flex" data-tab="citas"><i data-lucide="calendar" class="w-4 h-4 mr-2"></i> Citas Agendadas</button>
    <button onclick="switchTab('veterinario', 'perfil')" class="tab-btn-main px-5 py-4 border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex" data-tab="perfil"> Mi Perfil</button>
  </nav>

   {% include 'veterinario/inicio.html' %}
  {% include 'veterinario/consulta.html' %}
  {% include 'veterinario/buscar_paciente.html' %}
  {% include 'veterinario/citas.html' %}
  {% include 'veterinario/perfil.html' %}
  
<div id="veterinario-config"
     data-fecha-hoy="{{ hoy }}"
     data-uploads-url="{{ url_for('static', filename='uploads/') }}"
     data-crear-cita-url="{{ url_for('crear_cita') }}"
     hidden></div>
<script>
  window.VETERINARIO_CONFIG = {
    uploadsUrl: document.getElementById('veterinario-config').dataset.uploadsUrl,
    crearCitaUrl: document.getElementById('veterinario-config').dataset.crearCitaUrl
  };
</script>
<script src="{{ url_for('serve_js', filename='veterinario.js') }}" defer></script>
{% endblock %}
