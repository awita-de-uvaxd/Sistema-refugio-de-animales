<script>
      function abrirPerfilAdopcion(mascotaId) {
    const contenidoHTML = document.getElementById('perfil-mascota-' + mascotaId).innerHTML;
    openModal(contenidoHTML);
    lucide.createIcons();
  }

  function iniciarSolicitudAdopcion(mascotaId) {
    // Por ahora solo lanza una alerta. Más tarde lo conectaremos al formulario.
    closeModal();
    alert("Función de Solicitud de Adopción en construcción. Se dirigirá al formulario.");
  }

  function iniciarReclamo(mascotaId) {
      closeModal();
      openModal(`
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-bold text-red-600 flex items-center gap-2"><i data-lucide="shield-alert"></i> Reclamo de Propiedad (ID #` + mascotaId + `)</h2>
        </div>
        <p class="text-sm text-slate-600 mb-6">Por favor, proporciona datos precisos que demuestren de manera contundente que eres el dueño original de este animal.</p>
        
        <form action="/crear_reclamo/` + mascotaId + `" method="POST" enctype="multipart/form-data" class="space-y-4 border border-indigo-100 p-4 rounded-xl">
          <h3 class="text-indigo-800 font-bold mb-2">Datos de Reclamo Oficial</h3>
          <div><label class="block text-sm font-semibold mb-1 text-slate-700">¿A qué nombre exacto responde?</label><input type="text" name="nombre_responde" required class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500"></div>
          <div><label class="block text-sm font-semibold mb-1 text-slate-700">Marcas únicas (cicatrices, manchas específicas)</label><textarea name="marcas" required rows="3" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-500"></textarea></div>
          <div><label class="block text-sm font-semibold mb-1 text-slate-700">Sube fotografías de ti junto al animal</label><input type="file" name="evidencia_dueno" multiple accept="image/*" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs bg-white text-slate-500"></div>
          <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-md transition mt-4">Enviar Evidencia Oficial de Reclamo</button>
        </form>
      `);
      lucide.createIcons();
    }



</script>
