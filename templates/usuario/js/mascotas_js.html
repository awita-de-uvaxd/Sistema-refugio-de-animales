<script>


function abrirVincularBanco() {
    openModal(`
      <div class="bg-[#003B5C] p-8 -m-6 rounded-2xl text-white">
        <h2 class="text-center font-bold text-emerald-400 mb-6 text-sm tracking-wide">Vinculación de Mascotas</h2>
        <div class="bg-[#002b44] p-6 rounded-xl border border-[#004870] shadow-inner">
          <h3 class="text-center font-black text-xl mb-6 flex justify-center items-center gap-2">
            <i data-lucide="shield-check" class="w-6 h-6 text-emerald-400"></i> Autenticación Veterinaria
          </h3>
          <!-- SE CAMBIÓ A ONSUBMIT PARA INTERCEPTARLO POR JAVASCRIPT -->
          <form id="form-vinculacion" onsubmit="procesarVinculacion(event)" class="space-y-5">
            <div>
              <label class="block text-xs font-bold text-sky-200 mb-1">Código de Paciente</label>
              <div class="relative">
                <i data-lucide="hash" class="absolute left-3 top-3 text-slate-400 w-5 h-5"></i>
                <input type="text" name="codigo" required placeholder="Ej. EXT-1234" class="w-full bg-white text-slate-900 border-none rounded-lg py-3 pl-10 pr-3 font-mono font-bold outline-none">
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-sky-200 mb-1">Contraseña Temporal</label>
              <div class="relative">
                <i data-lucide="lock" class="absolute left-3 top-3 text-slate-400 w-5 h-5"></i>
                <input type="password" name="password" required placeholder="****" class="w-full bg-white text-slate-900 border-none rounded-lg py-3 pl-10 pr-3 font-mono font-bold outline-none">
              </div>
            </div>
            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3.5 rounded-lg transition shadow-md mt-4">Vincular Expediente</button>
          </form>
        </div>
      </div>
    `);
    lucide.createIcons();
  }

// NUEVA FUNCIÓN: Envía los datos por debajo de la mesa y muestra la respuesta
  function procesarVinculacion(e) {
      e.preventDefault(); // Evita recargar
      const form = document.getElementById('form-vinculacion');
      const formData = new FormData(form);

      fetch("{{ url_for('vincular_mascota') }}", {
          method: 'POST',
          body: formData
      })
      .then(response => response.json()) // Esperamos una respuesta en JSON
      .then(data => {
          if (data.status === 'success') {
              openModal(`
                  <div class="text-center p-6">
                      <i data-lucide="check-circle" class="w-20 h-20 text-emerald-500 mx-auto mb-4"></i>
                      <h2 class="text-2xl font-black text-slate-800 mb-2">¡Vinculación Exitosa!</h2>
                      <p class="text-slate-500 mb-6">El expediente clínico ahora forma parte de tu perfil.</p>
                      <button onclick="window.location.reload();" class="bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-emerald-700 transition">Aceptar y Ver Mascotas</button>
                  </div>
              `);
          } else {
              openModal(`
                  <div class="text-center p-6">
                      <i data-lucide="x-circle" class="w-20 h-20 text-red-500 mx-auto mb-4"></i>
                      <h2 class="text-2xl font-black text-slate-800 mb-2">Error de Vinculación</h2>
                      <p class="text-slate-500 mb-6">Código o contraseña incorrectos, o la mascota ya fue vinculada a otro perfil.</p>
                      <button onclick="abrirVincularBanco()" class="bg-red-100 text-red-700 font-bold py-3 px-8 rounded-xl hover:bg-red-200 transition">Intentar de nuevo</button>
                  </div>
              `);
          }
          lucide.createIcons();
      })
      .catch(error => {
          alert('Hubo un error de conexión con el servidor.');
      });
  }

function abrirEditarMascota(id, nombre) {
      // Construimos la URL de forma tradicional para evitar errores 404 con Jinja
      const formAction = "/editar_mascota/" + id;
      
      openModal(`
        <div class="p-4">
            <h2 class="text-xl font-black text-indigo-900 mb-6 border-b pb-3 flex items-center gap-2">
              <i data-lucide="edit-3" class="w-5 h-5"></i> Actualizar Perfil de ` + nombre + `
            </h2>
            <form action="` + formAction + `" method="POST" enctype="multipart/form-data" class="space-y-6">
              <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                  <label class="block text-sm font-bold text-slate-700 mb-2">Nombre Bautizado</label>
                  <input type="text" name="nombre" value="` + nombre + `" required class="w-full border border-slate-300 rounded-xl p-3 outline-indigo-500 shadow-inner text-sm font-semibold">
              </div>
              
              <div class="bg-indigo-50/50 p-5 rounded-xl border border-indigo-100">
                  <label class="block text-sm font-bold text-indigo-900 mb-2">Nueva Foto de Perfil</label>
                  <p class="text-xs text-slate-500 mb-3">Sube una imagen clara de su rostro. (JPG, PNG)</p>
                  <input type="file" name="foto" accept="image/*" class="w-full text-xs text-slate-500 file:bg-indigo-600 file:text-white file:font-bold file:border-0 file:px-4 file:py-2 file:rounded-lg cursor-pointer bg-white border border-indigo-200 rounded-xl p-2 shadow-sm">
              </div>
              
              <div class="flex gap-4 pt-2">
                  <button type="button" onclick="closeModal()" class="w-1/3 py-3.5 bg-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-300 transition">Cancelar</button>
                  <button type="submit" class="w-2/3 bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-md flex items-center justify-center gap-2">
                      <i data-lucide="save" class="w-4 h-4"></i> Guardar Cambios
                  </button>
              </div>
            </form>
        </div>
      `);
      lucide.createIcons();
    }
    
  function abrirExpedienteMascota(id) {
    const html = document.getElementById('historial-mi-mascota-' + id).innerHTML;
    openModal(html);
    lucide.createIcons();
  }


  function abrirEditarMascota(id, nombre) {
      // Construimos la URL de forma tradicional para evitar errores 404 con Jinja
      const formAction = "/editar_mascota/" + id;
      
      openModal(`
        <div class="p-4">
            <h2 class="text-xl font-black text-indigo-900 mb-6 border-b pb-3 flex items-center gap-2">
              <i data-lucide="edit-3" class="w-5 h-5"></i> Actualizar Perfil de ` + nombre + `
            </h2>
            <form action="` + formAction + `" method="POST" enctype="multipart/form-data" class="space-y-6">
              <div class="bg-slate-50 p-5 rounded-xl border border-slate-200">
                  <label class="block text-sm font-bold text-slate-700 mb-2">Nombre Bautizado</label>
                  <input type="text" name="nombre" value="` + nombre + `" required class="w-full border border-slate-300 rounded-xl p-3 outline-indigo-500 shadow-inner text-sm font-semibold">
              </div>
              
              <div class="bg-indigo-50/50 p-5 rounded-xl border border-indigo-100">
                  <label class="block text-sm font-bold text-indigo-900 mb-2">Nueva Foto de Perfil</label>
                  <p class="text-xs text-slate-500 mb-3">Sube una imagen clara de su rostro. (JPG, PNG)</p>
                  <input type="file" name="foto" accept="image/*" class="w-full text-xs text-slate-500 file:bg-indigo-600 file:text-white file:font-bold file:border-0 file:px-4 file:py-2 file:rounded-lg cursor-pointer bg-white border border-indigo-200 rounded-xl p-2 shadow-sm">
              </div>
              
              <div class="flex gap-4 pt-2">
                  <button type="button" onclick="closeModal()" class="w-1/3 py-3.5 bg-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-300 transition">Cancelar</button>
                  <button type="submit" class="w-2/3 bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition shadow-md flex items-center justify-center gap-2">
                      <i data-lucide="save" class="w-4 h-4"></i> Guardar Cambios
                  </button>
              </div>
            </form>
        </div>
      `);
      lucide.createIcons();
    }
    

</script>
