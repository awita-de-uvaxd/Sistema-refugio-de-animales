<script>
    /* --- FUNCIONES Y LÓGICA DEL SHOP (SIN DATOS DE EJEMPLO) --- */
    // Catálogo y pedidos obtenidos directamente de SQLite (cada cliente ve solo los suyos).
    let productos = [], historialVentas = [], carrito = [], ordenActivaSeguimiento = null, enviandoShop = false;
    const escShop = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function sincronizarShop() {
        try {
            const [a,b] = await Promise.all([fetch('/api/tienda/productos'),fetch('/api/tienda/pedidos')]);
            if(!a.ok||!b.ok)throw Error('No fue posible leer la tienda.');
            productos=(await a.json()).productos||[];
            historialVentas=(await b.json()).pedidos||[];
            document.querySelectorAll('#catalogo-grid button[data-id]').forEach(btn=>{
                const p=productos.find(x=>String(x.id)===btn.dataset.id);
                btn.disabled=!p||!p.visible||p.stock<1;
                if(p){btn.dataset.precio=p.precio;btn.dataset.stock=p.stock;}
            });
        } catch(e){console.error(e);}
    }
    document.addEventListener('DOMContentLoaded',sincronizarShop);

    function toggleSeguimientoModal() {
        const modal = document.getElementById('modal-seguimiento');
        if(modal) modal.classList.toggle('hidden');
    }

    function renderizarCatalogo(lista) {
        const grid = document.getElementById('catalogo-grid');
        if(!grid) return;
        const visibles = lista.filter(p => p.visible);
        if(visibles.length === 0) { 
            grid.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400 py-8">No hay productos disponibles.</p>`; 
            return; 
        }
        grid.innerHTML = visibles.map(p => `
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between">
                <img src="${p.img}" class="w-full h-36 object-cover">
                <div class="p-4 space-y-2 flex-1 flex flex-col justify-between">
                    <div>
                        <span class="text-[10px] font-bold bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">${p.categoria}</span>
                        <h3 class="font-bold text-sm text-slate-800 mt-1">${p.nombre}</h3>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t">
                        <span class="font-black text-slate-800">Q${p.precio.toFixed(2)}</span>
                        <button onclick="agregarAlCarrito('${p.id}')" ${p.stock <= 0 ? 'disabled' : ''} class="px-3 py-1.5 bg-purple-primary text-white rounded-xl font-bold text-xs hover:bg-purple-dark transition disabled:bg-slate-300">
                            ${p.stock > 0 ? '+ Agregar' : 'Agotado'}
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function filtrarCatalogo() { 
        const input = document.getElementById('catalogo-search');
        const query = input ? input.value.toLowerCase() : '';
        const tarjetas = document.querySelectorAll('#catalogo-grid > div[data-nombre]');

        tarjetas.forEach(card => {
            const nombre = card.getAttribute('data-nombre').toLowerCase();
            if (nombre.includes(query)) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }

    function filtrarCategoria(cat) { 
        const tarjetas = document.querySelectorAll('#catalogo-grid > div[data-categoria]');

        tarjetas.forEach(card => {
            const categoria = card.getAttribute('data-categoria');
            if (cat === 'Todos' || categoria === cat) {
                card.classList.remove('hidden');
            } else {
                card.classList.add('hidden');
            }
        });
    }

    function toggleNitCampo() {
      const container = document.getElementById('campo-nit-container');
      const checkbox = document.getElementById('requiere-factura');
      if (container && checkbox) {
        if (checkbox.checked) {
          container.classList.remove('hidden');
          document.getElementById('recibe-nit')?.focus();
        } else {
          container.classList.add('hidden');
          const nitInput = document.getElementById('recibe-nit');
          if (nitInput) nitInput.value = '';
        }
      }
    }
    
    function toggleCartModal() { 
        const modal = document.getElementById('modal-carrito');
        if(modal) modal.classList.toggle('hidden'); 
    }

    function abrirModalDetalle(prodId) {
        const elem = document.getElementById('detalle-prod-data-' + prodId);
        if (elem) {
            openModal(elem.innerHTML);
            lucide.createIcons();
        }
    }

    // Reemplazar únicamente estas dos funciones en <script>
function prepararAgregarCarrito(btn) {
    const id = btn.dataset.id;
    const nombre = btn.dataset.nombre;
    const precio = parseFloat(btn.dataset.precio) || 0;
    const stockMax = parseInt(btn.dataset.stock) || 0;

    agregarAlCarrito(id, nombre, precio, stockMax);
}

    function agregarAlCarrito(id, nombre, precio, stockMaxParam) {
        const numId = parseInt(String(id).replace(/\D/g, ''));
        const p = productos.find(x => String(x.id) === String(id) || parseInt(String(x.id).replace(/\D/g, '')) === numId);
        
        const stockMax = p ? parseInt(p.stock) : (parseInt(stockMaxParam) || 0);

        if (stockMax <= 0) {
            mostrarNotificacionFlotante('Producto agotado o sin disponibilidad.');
            return;
        }

        const prodNombre = nombre || (p ? p.nombre : 'Producto');
        const prodPrecio = parseFloat(precio) || (p ? parseFloat(p.precio) : 0);
        const itemExistente = carrito.find(i => String(i.id) === String(id));

        if (itemExistente) {
            if (itemExistente.cantidad < stockMax) {
                itemExistente.cantidad += 1;
                mostrarNotificacionFlotante(`+1 "${prodNombre}" agregado al carrito`);
            } else {
                mostrarNotificacionFlotante(`Límite de stock alcanzado (${stockMax} disponibles).`);
                return;
            }
        } else {
            carrito.push({ id, nombre: prodNombre, precio: prodPrecio, cantidad: 1 });
            mostrarNotificacionFlotante(`"${prodNombre}" agregado al carrito`);
        }

        actualizarCarritoUI();
    }

        function cambiarCantidadCarrito(id, d) {
            const item = carrito.find(x => String(x.id) === String(id));
            if (!item) return;

            const p = productos.find(x => String(x.id) === String(id) || parseInt(String(x.id).replace(/\D/g, '')) === parseInt(String(id).replace(/\D/g, '')));
            const stockMax = p ? parseInt(p.stock) : item.cantidad;

            const nuevaCant = item.cantidad + d;
            if (nuevaCant <= 0) {
                carrito = carrito.filter(x => String(x.id) !== String(id));
            } else {
                item.cantidad = Math.min(nuevaCant, stockMax);
            }
            actualizarCarritoUI();
        }

    function actualizarCarritoUI() {
        const totalCant = carrito.reduce((a, b) => a + b.cantidad, 0);
        const badge = document.getElementById('cart-badge');
        if (badge) badge.innerText = totalCant;

        const list = document.getElementById('cart-items-list');
        if (list) {
            list.innerHTML = carrito.length === 0 ? `<p class="text-center text-xs text-slate-400 py-4">El carrito está vacío.</p>` :
                carrito.map(i => {
                    const p = productos.find(x => String(x.id) === String(i.id) || parseInt(String(x.id).replace(/\D/g, '')) === parseInt(String(i.id).replace(/\D/g, '')));
                    const stockMax = p ? parseInt(p.stock) : i.cantidad;
                    const topeAlcanzado = i.cantidad >= stockMax;

                    return `
                        <div class="flex justify-between items-center text-xs bg-slate-50 p-3 rounded-xl border">
                            <div>
                                <h4 class="font-bold">${i.nombre}</h4>
                                <p class="text-slate-400">Q${i.precio.toFixed(2)} c/u (Disp: ${stockMax})</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="cambiarCantidadCarrito('${i.id}', -1)" class="px-2 bg-white border font-bold rounded hover:bg-slate-100">-</button>
                                <span class="font-bold">${i.cantidad}</span>
                                <button onclick="cambiarCantidadCarrito('${i.id}', 1)" ${topeAlcanzado ? 'disabled' : ''} class="px-2 bg-white border font-bold rounded hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed">+</button>
                                <span class="font-bold ml-2">Q${(i.precio * i.cantidad).toFixed(2)}</span>
                            </div>
                        </div>
                    `;
                }).join('');
        }
        
        const sub = carrito.reduce((a, b) => a + (b.precio * b.cantidad), 0);
        const devElem = document.querySelector('input[name="delivery-option"]:checked');
        const dev = devElem ? devElem.value : 'domicilio';
        const ship = dev === 'domicilio' ? 35.00 : 0.00;
        
        const elSub = document.getElementById('cart-subtotal');
        const elShip = document.getElementById('cart-shipping');
        const elTotal = document.getElementById('cart-total');
        if (elSub) elSub.innerText = `Q${sub.toFixed(2)}`;
        if (elShip) elShip.innerText = `Q${ship.toFixed(2)}`;
        if (elTotal) elTotal.innerText = `Q${(sub + ship).toFixed(2)}`;
    }

    function toggleEntregaCampos() {
        const devElem = document.querySelector('input[name="delivery-option"]:checked');
        const dev = devElem ? devElem.value : 'domicilio';
        const boxDir = document.getElementById('box-direccion');
        
        if (boxDir) {
            boxDir.classList.toggle('hidden', dev !== 'domicilio');
        }
        actualizarCarritoUI();
    }

    function toggleFormaPago() {
        const pagoElem = document.querySelector('input[name="metodo-pago"]:checked');
        const m = pagoElem ? pagoElem.value : 'tarjeta';
        const formTarj = document.getElementById('form-tarjeta');
        const infoDep = document.getElementById('info-deposito');
        if(formTarj) formTarj.classList.toggle('hidden', m !== 'tarjeta');
        if(infoDep) infoDep.classList.toggle('hidden', m === 'tarjeta');
    }

    async function procesarOrden() {
        if (!carrito || carrito.length === 0) {
            mostrarNotificacionFlotante('El carrito de compras está vacío.');
            return;
        }

        const devElem = document.querySelector('input[name="delivery-option"]:checked');
        const dev = devElem ? devElem.value : 'domicilio';

        const nom = document.getElementById('recibe-nombre')?.value.trim();
        const tel = document.getElementById('recibe-telefono')?.value.trim();
        let dir = 'Recoger en Recepción Refugio';

        if (!nom || !tel) {
            mostrarNotificacionFlotante('Ingresa tu Nombre y Teléfono de contacto.');
            return;
        }

        if (dev === 'domicilio') {
            dir = document.getElementById('recibe-direccion')?.value.trim();
            if (!dir) {
                mostrarNotificacionFlotante('Ingresa la Dirección exacta de entrega.');
                return;
            }
        }

        const sub = carrito.reduce((a, b) => a + (b.precio * b.cantidad), 0);
        const env = dev === 'domicilio' ? 35.00 : 0.00;
        const totalEsperado = sub + env;

        const pagoElem = document.querySelector('input[name="metodo-pago"]:checked');
        const m = pagoElem ? pagoElem.value : 'tarjeta';
        const met = m === 'tarjeta' ? 'Tarjeta por coordinar' : 'Transferencia';

        if (m === 'deposito') {
            const montoIngresado = parseFloat(document.getElementById('deposito-monto')?.value || 0);
            const refIngresada = document.getElementById('deposito-ref')?.value.trim();

            if (!refIngresada) {
                mostrarNotificacionFlotante('Ingresa el número de referencia del depósito.');
                return;
            }

            if (Math.abs(montoIngresado - totalEsperado) > 0.01) {
                mostrarNotificacionFlotante(`Agregar monto exacto (Q${totalEsperado.toFixed(2)}).`);
                return;
            }
        }

        const chkFactura = document.getElementById('requiere-factura');
        const inputNit = document.getElementById('recibe-nit');
        let nitRegistrado = 'Consumidor Final';

        if (chkFactura && chkFactura.checked) {
            if (inputNit && inputNit.value.trim() !== '') {
                nitRegistrado = inputNit.value.trim().toUpperCase();
            } else {
                mostrarNotificacionFlotante('Ingresa tu número de NIT para la factura.');
                return;
            }
        }

        const estP = `PENDIENTE DE VERIFICACIÓN (${m === 'tarjeta' ? 'Tarjeta' : 'Transferencia'})`;

        const orden = {
            id: "PED-" + Math.floor(1000 + Math.random() * 9000),
            fecha: new Date().toLocaleDateString('es-GT'),
            nit: nitRegistrado,
            clienteNombre: nom,
            clienteTel: tel,
            clienteDir: dir,
            itemsDetalle: JSON.parse(JSON.stringify(carrito)),
            subtotal: sub,
            envio: env,
            total: totalEsperado,
            tipo: dev === 'domicilio' ? 'Domicilio' : 'Tienda',
            metodoPago: met,
            referenciaPago: m === 'deposito' ? document.getElementById('deposito-ref')?.value.trim() : '',
            estadoPago: estP,
            estadoOrden: '1. Tomando',
            stockDescontado: false,
            entregado: false
        };

        if (enviandoShop) return;
        enviandoShop = true;
        const boton = document.getElementById('btn-confirmar-shop');
        if(boton) boton.disabled=true;
        try {
            const response=await fetch('/api/tienda/pedidos',{
                method:'POST',credentials:'same-origin',
                headers:{'Content-Type':'application/json','X-CSRF-Token':window.HUELLITAS_SHOP_CSRF||''},
                body:JSON.stringify(orden)
            });
            const data=await response.json().catch(()=>({}));
            if(!response.ok||data.status!=='ok')throw Error(data.message||'No se pudo registrar el pedido.');
            const nueva=data.pedido;
            historialVentas.unshift(nueva);
            ordenActivaSeguimiento=nueva;
            carrito=[];
            actualizarCarritoUI();
            if(typeof limpiarFormularioCarrito==='function')limpiarFormularioCarrito();
            document.getElementById('modal-carrito')?.classList.add('hidden');
            actualizarBarraProgresivaCliente(nueva);
            document.getElementById('modal-seguimiento')?.classList.remove('hidden');
            await sincronizarShop();
            mostrarNotificacionFlotante(`Pedido ${nueva.id} registrado. Espera la verificación del refugio.`);
        }catch(e){mostrarNotificacionFlotante(e.message);}finally{enviandoShop=false;if(boton)boton.disabled=false;}
    }

    async function buscarOrdenCliente(){
        const q=(document.getElementById('input-search-order')?.value||'').trim().toUpperCase();
        const m=/^PED-0*([1-9][0-9]*)$/.exec(q);
        if(!m){mostrarNotificacionFlotante('Ingresa un folio correcto: PED-000001');return;}
        try{const r=await fetch(`/api/tienda/pedidos/${Number(m[1])}`);if(!r.ok)throw Error('Orden no encontrada o no te pertenece.');const d=await r.json();ordenActivaSeguimiento=d.pedido;actualizarBarraProgresivaCliente(d.pedido);}catch(e){mostrarNotificacionFlotante(e.message);}
    }

    function actualizarBarraProgresivaCliente(orden) {
        const code = document.getElementById('tracking-code');
        const msg = document.getElementById('order-status-msg');
        if(code) code.innerText = `Código: ${orden.id}`;
        if(msg) msg.innerHTML = `Orden <strong>${escShop(orden.id)}</strong> (${escShop(orden.tipo)}) - Estado: <strong class="text-purple-primary">${escShop(orden.cancelado?'Cancelado':orden.estadoOrden)}</strong> | Pago: <strong>${escShop(orden.estadoPago)}</strong>`;
        
        const steps = ["1. Tomando", "2. Aceptado", "3. Procesando", "4. Empacando", "5. Finalizar"];
        const idx = steps.findIndex(s => orden.estadoOrden.includes(s.split('.')[0]));

        for(let i=1; i<=5; i++) {
            const stepElem = document.getElementById(`step-${i}`);
            if(stepElem) {
                stepElem.className = (i - 1 <= idx) ? "bg-indigo-600 text-white py-2.5 rounded-xl shadow-sm font-bold" : "bg-slate-200 text-slate-500 py-2.5 rounded-xl shadow-sm";
            }
        }

        const btnFactura = document.getElementById('btn-dl-factura');
        if(btnFactura) {
            if(orden.estadoPago.includes('PAGADO')) btnFactura.removeAttribute('disabled');
            else btnFactura.setAttribute('disabled', 'true');
        }
    }

    function descargarDocumentoCliente(tipo) {
        if (!ordenActivaSeguimiento) {
            mostrarNotificacionFlotante('Por favor, busca tu pedido antes de descargar.');
            return;
        }
        const o = ordenActivaSeguimiento;

        const wrapper = document.getElementById('pdf-render-wrapper');
        if (wrapper) wrapper.style.display = 'block';

        const titleEl = document.getElementById('pdf-doc-title');
        const ordIdEl = document.getElementById('pdf-ord-id');
        const dateEl = document.getElementById('pdf-date');
        const clientBox = document.getElementById('pdf-client-box');
        const statusBadge = document.getElementById('pdf-status-badge');
        const itemsBody = document.getElementById('pdf-items-body');
        const subtotalEl = document.getElementById('pdf-subtotal');
        const shippingEl = document.getElementById('pdf-shipping');
        const totalEl = document.getElementById('pdf-total');

        if (ordIdEl) ordIdEl.innerText = `#${o.id || 'PED-0000'}`;
        if (dateEl) dateEl.innerText = `Fecha: ${o.fecha || new Date().toLocaleDateString('es-GT')}`;

        let direccionTexto = 'Recoger en Recepción';
        if (o.clienteDir && o.clienteDir.trim() !== '' && o.clienteDir !== 'N/A' && o.clienteDir !== 'Recoger en Recepción') {
            direccionTexto = o.clienteDir;
        } else if (o.tipoEntrega === 'domicilio') {
            direccionTexto = 'Envío a Domicilio';
        }

        const clienteNombre = o.clienteNombre || 'Cliente';
        const clienteTel = o.clienteTel || 'N/A';
        const nitCliente = o.nit || o.clienteNit || 'Consumidor Final';

        if (tipo === 'ORDEN_COMPRA') {
            if (titleEl) titleEl.innerText = "ORDEN DE COMPRA";
            if (statusBadge) {
                statusBadge.innerText = "PENDIENTE POR PAGAR";
                statusBadge.style.backgroundColor = "#FEF3C7";
                statusBadge.style.color = "#92400E";
                statusBadge.style.border = "1px solid #FCD34D";
            }
            if (clientBox) {
                clientBox.innerHTML = `
                    <p style="margin:2px 0;"><strong>Cliente:</strong> ${escShop(clienteNombre)}</p>
                    <p style="margin:2px 0;"><strong>NIT:</strong> ${escShop(nitCliente)}</p>
                    <p style="margin:2px 0;"><strong>Dirección:</strong> ${escShop(direccionTexto)}</p>
                    <p style="margin:2px 0;"><strong>Teléfono:</strong> ${escShop(clienteTel)}</p>
                    <p style="margin:2px 0;"><strong>Estado de Cuenta:</strong> <span style="color:#B45309; font-weight:bold;">Pago pendiente de verificación</span></p>
                `;
            }
        } else {
            if (titleEl) titleEl.innerText = "COMPROBANTE DE COMPRA";
            if (statusBadge) {
                statusBadge.innerText = "PAGO VERIFICADO";
                statusBadge.style.backgroundColor = "#D1FAE5";
                statusBadge.style.color = "#065F46";
                statusBadge.style.border = "1px solid #6EE7B7";
            }
            const metodoPago = o.metodoPago || 'Presencial (Tarjeta POS)';
            if (clientBox) {
                clientBox.innerHTML = `
                    <p style="margin:2px 0;"><strong>Cliente:</strong> ${escShop(clienteNombre)}</p>
                    <p style="margin:2px 0;"><strong>NIT:</strong> ${escShop(nitCliente)}</p>
                    <p style="margin:2px 0;"><strong>Dirección:</strong> ${escShop(direccionTexto)}</p>
                    <p style="margin:2px 0;"><strong>Teléfono:</strong> ${escShop(clienteTel)}</p>
                    <p style="margin:2px 0;"><strong>Estado de Cuenta:</strong> <span style="color:#047857; font-weight:bold;">Pago confirmado (${metodoPago})</span></p>
                `;
            }
        }

        const items = o.itemsDetalle || [];
        if (itemsBody) {
            itemsBody.innerHTML = items.map(i => {
                const precio = parseFloat(i.precio || 0);
                const cant = parseInt(i.cantidad || 1);
                const sub = precio * cant;
                return `
                    <tr style="border-bottom: 1px solid #f1f5f9;">
                        <td style="padding: 12px 8px; font-weight: 600; color: #64748b;">${i.id || 'PROD'}</td>
                        <td style="padding: 12px 8px; font-weight: 700; color: #0f172a;">${escShop(i.nombre)}</td>
                        <td style="padding: 12px 8px; text-align: center; font-weight: 600;">${cant}</td>
                        <td style="padding: 12px 8px; text-align: right; color: #475569;">Q${precio.toFixed(2)}</td>
                        <td style="padding: 12px 8px; text-align: right; font-weight: 700; color: #0f172a;">Q${sub.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
        }

        const subtotal = parseFloat(o.subtotal || (o.total - (o.envio || 0)));
        const envio = parseFloat(o.envio || 0);
        const total = parseFloat(o.total || 0);

        if (subtotalEl) subtotalEl.innerText = `Q${subtotal.toFixed(2)}`;
        if (shippingEl) shippingEl.innerText = `Q${envio.toFixed(2)}`;
        if (totalEl) totalEl.innerText = `Q${total.toFixed(2)}`;

        const element = document.getElementById('pdf-template');

        const opt = {
            margin:       0,
            filename:     `${tipo}_${o.id}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false, scrollX: 0, scrollY: 0 },
            jsPDF:        { unit: 'pt', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            if (wrapper) wrapper.style.display = 'none';
        }).catch(() => {
            if (wrapper) wrapper.style.display = 'none';
        });
    }

    function limpiarFormularioCarrito() {
        const nomDom = document.getElementById('recibe-nombre'); if (nomDom) nomDom.value = '';
        const telDom = document.getElementById('recibe-telefono'); if (telDom) telDom.value = '';
        const dirDom = document.getElementById('recibe-direccion'); if (dirDom) dirDom.value = '';

        const cardHolder = document.getElementById('card-holder'); if (cardHolder) cardHolder.value = '';
        const cardNum = document.getElementById('card-number'); if (cardNum) cardNum.value = '';
        const cardExp = document.getElementById('card-exp'); if (cardExp) cardExp.value = '';
        const cardCvv = document.getElementById('card-cvv'); if (cardCvv) cardCvv.value = '';

        const depMonto = document.getElementById('deposito-monto'); if (depMonto) depMonto.value = '';
        const depRef = document.getElementById('deposito-ref'); if (depRef) depRef.value = '';

        const nomTienda = document.getElementById('recibe-nombre-tienda'); if (nomTienda) nomTienda.value = '';
        const telTienda = document.getElementById('recibe-telefono-tienda'); if (telTienda) telTienda.value = '';

        const chkFactura = document.getElementById('requiere-factura'); if (chkFactura) chkFactura.checked = false;
        const inputNit = document.getElementById('recibe-nit'); if (inputNit) inputNit.value = '';
        const containerNit = document.getElementById('campo-nit-container'); if (containerNit) containerNit.classList.add('hidden');

        const radioDom = document.querySelector('input[name="delivery-option"][value="domicilio"]');
        if (radioDom) {
            radioDom.checked = true;
            toggleEntregaCampos();
        }

        const radioTarjeta = document.querySelector('input[name="metodo-pago"][value="tarjeta"]');
        if (radioTarjeta) {
            radioTarjeta.checked = true;
            toggleFormaPago();
        }
    }

    function toggleMisOrdenesModal() {
        const modal = document.getElementById('modal-mis-ordenes');
        if (modal) modal.classList.toggle('hidden');
    }

    async function abrirModalMisOrdenes() {
        const lista = document.getElementById('lista-mis-ordenes');
        if (!lista) return;

        await sincronizarShop();
        const aceptadas = historialVentas;

        if (aceptadas.length === 0) {
            lista.innerHTML = `
                <div class="p-6 text-center bg-slate-50 border border-slate-200 rounded-2xl">
                    <p class="text-xs text-slate-400 font-bold">Todavía no hay órdenes registradas.</p>
                    <p class="text-[10px] text-slate-400 mt-1">Los pedidos que realices aparecerán aquí.</p>
                </div>
            `;
        } else {
            lista.innerHTML = aceptadas.map(o => `
                <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-2 hover:border-emerald-300 transition">
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] font-extrabold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full">
                            ✓ ${escShop(o.cancelado?'Cancelado':o.estadoOrden.replace(/^\d+\.\s*/, ''))}
                        </span>
                        <span class="text-[10px] text-slate-400 font-medium">${o.fecha || 'Reciente'}</span>
                    </div>

                    <div class="flex items-center gap-3 pt-1">
                        <div class="w-10 h-10 bg-amber-100/80 rounded-xl flex items-center justify-center text-lg shrink-0">
                            📦
                        </div>
                        <div>
                            <h4 class="font-black text-slate-800 text-sm tracking-tight">${o.id}</h4>
                            <p class="text-xs font-semibold text-slate-500">Total Q${parseFloat(o.total || 0).toFixed(2)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        const modal = document.getElementById('modal-mis-ordenes');
        if (modal) modal.classList.remove('hidden');
    }

    function mostrarNotificacionFlotante(mensaje) {
        let toast = document.getElementById('notificacion-flotante');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'notificacion-flotante';
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 backdrop-blur-md text-white font-bold text-xs px-5 py-3 rounded-2xl shadow-2xl border border-slate-700 transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2';
            document.body.appendChild(toast);
        }
        
        toast.innerHTML = `<span>⚠️</span> <span>${mensaje}</span>`;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');

        setTimeout(() => {
            toast.classList.remove('opacity-100');
            toast.classList.add('opacity-0', 'pointer-events-none');
        }, 3500);
    }
</script>
