<!-- ======================================================= -->
  <!-- PESTAÑA 2: ALERTAS CIUDADANAS (Validado Estricto)       -->
  <!-- ======================================================= -->
  <div id="usuario-alertas" class="tab-content tab-content-usuario">
    <div class="bg-white rounded-xl shadow-sm p-8 max-w-3xl mx-auto border-t-4 border-red-500 form-extenso">
      <h2 class="text-2xl font-bold text-center text-red-600 mb-2">Reportar Alerta Ciudadana</h2>
      <p class="text-center text-slate-500 mb-6 text-sm">Tu reporte llegará inmediatamente al panel de nuestros rescatistas.</p>
      
      <form id="form-alerta" action="{{ url_for('crear_alerta') }}" method="POST" enctype="multipart/form-data" onsubmit="return validarAlerta(event)">
        <fieldset>
          <legend>Situación</legend>
          <label>Nivel de Urgencia:</label>
          <select name="urgencia" required>
            <option value="Media">Media (Animal asustado o perdido)</option>
            <option value="Grave">Grave (Herido o atrapado)</option>
            <option value="Crítico">Crítico (Peligro de muerte inminente)</option>
          </select>
          
          <!-- Filtro estricto: Letras y Números en tiempo real -->
          <label>Animal (Especie y Cantidad):</label>
          <input type="text" name="especie_cantidad" required maxlength="50" oninput="filtrarAlfanumericoInput(this)" placeholder="Ej. 1 perro mediano negro">
          
          <!-- Filtro estricto: Letras, Números y saltos de línea -->
          <label>Descripción de lo sucedido:</label>
          <textarea id="desc-alerta" name="descripcion" required maxlength="200" rows="2" placeholder="Detalla cómo lo encontraste..." oninput="filtrarAlfanumericoTextarea(this)"></textarea>
          <p class="text-[10px] text-slate-400 text-right mt-1"><span id="contador-desc">0</span>/200</p>
          
          <label class="mt-4">Adjuntar Fotografía (Máximo 50MB):</label>
          <input type="file" id="foto-alerta" name="foto" accept="image/*" class="w-full border rounded-lg p-2 text-sm bg-white">
        </fieldset>
        
        <fieldset>
          <legend>Ubicación y Contacto</legend>
          
          <!-- Filtro estricto: Letras, Números y Guiones en tiempo real -->
          <label>Dirección exacta o referencia:</label>
          <input type="text" name="direccion" required maxlength="50" oninput="filtrarDireccion(this)" placeholder="Ej. Calle 12-25 Zona 1">
          
          <div class="grid grid-cols-2 gap-4 mt-2">
            <div>
              <label>Tipo de Entorno:</label>
              <select name="entorno" class="w-full border rounded-lg p-2">
                <option value="Vía Pública">Vía Pública / Calle</option>
                <option value="Terreno Baldío">Terreno Baldío</option>
                <option value="Casa Abandonada">Casa Abandonada</option>
                <option value="Barranco">Barranco / Río</option>
              </select>
            </div>
            <div>
              <!-- Filtro estricto: Solo Letras -->
              <label>Indicaciones de llegada:</label>
              <input type="text" name="indicaciones" maxlength="50" oninput="filtrarSoloLetras(this)" placeholder="Ej. Al lado de la tienda azul">
            </div>
          </div>
          
          <!-- Filtro estricto: Solo Letras -->
          <label class="mt-4">Tu Nombre:</label>
          <input type="text" name="nombre_reporta" required maxlength="20" oninput="filtrarSoloLetras(this)" value="{{ session['nombre'] }}">
          
          <!-- Filtro estricto: Solo Formato 502-XXXX-XXXX -->
          <label>Tu Teléfono (Formato: 502-XXXX-XXXX):</label>
          <input type="text" name="telefono_reporta" required maxlength="13" oninput="formatearTelefono(this)" placeholder="Ej. 502-5555-4444">
        </fieldset>
        
        <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-xl mt-4 shadow-md transition text-lg flex items-center justify-center gap-2">
          <i data-lucide="send" class="w-5 h-5"></i> Enviar Alerta al Refugio
        </button>
      </form>
    </div>
  </div>

  <script>
    // 1. Filtro Alfanumérico (Letras, Números, Espacios)
    function filtrarAlfanumericoInput(input) {
        input.value = input.value.replace(/[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñ ]/g, '');
    }

    // 2. Filtro Alfanumérico + Saltos de línea (Para Textarea)
    function filtrarAlfanumericoTextarea(textarea) {
        textarea.value = textarea.value.replace(/[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñ \n]/g, '');
        document.getElementById('contador-desc').innerText = textarea.value.length;
    }

    // 3. Filtro de Dirección (Letras, Números, Espacios, Guiones y Comas)
    function filtrarDireccion(input) {
        // Permitimos el guión medio para direcciones tipo 12-25 y la coma
        input.value = input.value.replace(/[^A-Za-z0-9ÁÉÍÓÚáéíóúÑñ \-,]/g, '');
    }

    // 4. Filtro Solo Letras (y espacios)
    function filtrarSoloLetras(input) {
        input.value = input.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ ]/g, '');
    }

    // 5. Autocompletado y Formato del Teléfono
    function formatearTelefono(input) {
        // Elimina todo lo que no sea número
        let valor = input.value.replace(/\D/g, '');
        
        // Aplica el formato 502-XXXX-XXXX a medida que se escribe
        if (valor.length > 3 && valor.length <= 7) {
            valor = valor.substring(0, 3) + '-' + valor.substring(3, 7);
        } else if (valor.length > 7) {
            valor = valor.substring(0, 3) + '-' + valor.substring(3, 7) + '-' + valor.substring(7, 11);
        }
        
        input.value = valor;
    }

    // Validación Final antes de enviar (Tamaño de foto de 50MB y formato de teléfono)
    function validarAlerta(event) {
        // Validar tamaño de foto
        const fotoInput = document.getElementById('foto-alerta');
        if (fotoInput.files.length > 0) {
            const fileSize = fotoInput.files[0].size;
            const maxSize = 50 * 1024 * 1024; // 50 MB
            
            if (fileSize > maxSize) {
                alert("La fotografía es demasiado pesada. El límite máximo es de 50MB.");
                event.preventDefault();
                return false;
            }
        }

        // Validar longitud del teléfono
        const telefonoInput = document.querySelector('input[name="telefono_reporta"]');
        if (telefonoInput.value.length !== 13) {
            alert("Por favor, ingrese un número de teléfono válido (Ej: 502-1234-5678).");
            event.preventDefault();
            return false;
        }

        return true;
    }
  </script>
  <!-- FIN DE LA PESTAÑA 2 -->
