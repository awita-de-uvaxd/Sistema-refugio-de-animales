<div id="veterinario-citas" class="tab-content tab-content-veterinario">
    <!-- Citas agendadas (sin cambios, ya funcionaba perfecto) -->
    <div class="bg-white rounded-xl shadow-sm p-8 max-w-5xl mx-auto">
      <div class="flex justify-between items-center mb-6 border-b pb-4"><h2 class="text-2xl font-black text-indigo-950">Agenda General de Citas</h2></div>
      <div class="space-y-4">
        {% if citas %}
          {% for c in citas %}
            <div class="border border-slate-200 p-5 rounded-2xl flex justify-between items-center bg-white shadow-sm hover:shadow transition">
              <div>
                <p class="font-black text-indigo-900 text-lg">Fecha: {{ c.fecha }} - Paciente #{{ c.paciente_id }} ({{ c.paciente_obj.nombre }})</p>
                <p class="text-sm text-slate-500 flex items-center gap-1 mt-1"><i data-lucide="clipboard-list" class="w-4 h-4"></i> Motivo: {{ c.motivo }}</p>
              </div>
              <button onclick="abrirExpediente('{{ c.paciente_id }}')" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-6 py-3 text-sm font-bold rounded-lg transition border border-slate-200">Ver Expediente Clínico</button>
            </div>
          {% endfor %}
        {% else %}
          <p class="text-center text-slate-500 p-8 border rounded-xl bg-slate-50 italic">No hay citas programadas.</p>
        {% endif %}
      </div>
    </div>
  </div>
