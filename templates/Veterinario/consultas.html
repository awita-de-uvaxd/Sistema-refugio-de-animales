  <!-- PESTAÑA 2: NUEVA CONSULTA -->
  <div id="veterinario-nueva" class="tab-content tab-content-veterinario">
    <div class="bg-white rounded-xl shadow-sm p-8 max-w-6xl mx-auto">
      <div class="flex justify-between items-center border-b pb-6 mb-6">
        <div>
          <h2 class="text-2xl font-black text-indigo-950 flex items-center gap-3">
            <span id="titulo-consulta">Nuevo Animal Registrado</span>
            <select id="selector-ruta" disabled class="text-sm border-2 border-indigo-200 rounded-lg p-1 text-indigo-700 font-bold outline-none bg-indigo-50 cursor-not-allowed">
              <option value="Externo">Externo (Con Dueño)</option>
              <option value="Rescate">Rescatado (Refugio)</option>
              <option value="Seguimiento">Cita de Seguimiento</option>
            </select>
          </h2>
          <p id="subtitulo-consulta" class="text-emerald-600 font-semibold text-sm mt-1">Creando expediente en blanco para nuevo ingreso.</p>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-indigo-700 bg-indigo-50 px-4 py-2 border border-indigo-100 rounded-lg text-sm font-mono">ID Asignado: <strong id="lbl-id">Automático</strong></span>
        </div>
      </div>
      
      <!-- FORMULARIO PRINCIPAL -->
      <form id="form-consulta-vet" action="{{ url_for('crear_consulta') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="tipo_ingreso" id="form-tipo-ingreso" value="Externo">
        <input type="hidden" name="rescate_id" id="form-rescate-id" value="">
        <input type="hidden" name="paciente_existente_id" id="form-paciente-id" value="">
        <input type="hidden" name="cita_id" id="form-cita-id" value="">
        <input type="hidden" name="sintomas_ocultos" id="sintomas-hidden" value="">
        <input type="hidden" name="vacunas_ocultas" id="vacunas-hidden" value="">
        <input type="hidden" name="codigo_acceso" id="hidden-codigo-acceso" value="">
        <input type="hidden" name="password_acceso" id="hidden-password-acceso" value="">
        
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
          
          <!-- COLUMNA 1: PERFIL -->
          <div class="md:col-span-4 space-y-5">
            <h4 class="font-bold text-sm text-indigo-700 uppercase tracking-widest border-b border-indigo-100 pb-2 mb-4">1. Perfil del Paciente</h4>
            <div><label class="block text-sm font-bold mb-1 text-slate-800">Nombre</label><input type="text" name="nombre_paciente" id="form-nombre" class="w-full border rounded-lg p-2.5 outline-none bg-slate-50"></div>
            <div><label class="block text-sm font-bold mb-1 text-slate-800">Especie</label>
              <div class="flex gap-2">
                <div class="relative flex-1">
                  <input type="text" name="especie" id="form-especie" data-especie-campo maxlength="50" autocomplete="off"
                    onfocus="abrirMenuEspecies(true)" onclick="abrirMenuEspecies(true)" oninput="abrirMenuEspecies()" onblur="cerrarMenuEspeciesTarde()"
                    onkeydown="if (event.key === 'Escape') cerrarMenuEspecies()"
                    class="w-full border rounded-lg p-2.5 pr-9 outline-none bg-slate-50 focus:border-indigo-500 focus:bg-white transition">
                  <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-3 top-3.5 pointer-events-none"></i>
                  <div id="menu-especies" class="hidden absolute z-30 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-xl max-h-56 overflow-y-auto custom-scroll py-1"></div>
                </div>
                <button type="button" onclick="abrirGestorEspecies()" class="flex-shrink-0 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 rounded-lg transition" title="Agregar, editar o borrar especies"><i data-lucide="settings-2" class="w-4 h-4"></i></button>
              </div>
            </div>
            <div><label class="block text-sm font-bold mb-1 text-slate-800">Sexo</label>
              <select name="sexo" id="form-sexo" class="w-full border rounded-lg p-2.5 outline-none bg-slate-50">
                <option value="Macho">Macho</option><option value="Hembra">Hembra</option>
              </select>
            </div>
            
            <!-- FOTO DE PERFIL CON VISOR EN VIVO (Retiene imagen previa) -->
            <div class="mt-4">
              <label class="block text-sm font-bold mb-1 text-slate-800">Foto de Perfil</label>
              <div id="preview-perfil-container" class="hidden mb-3 w-32 h-32 rounded-xl overflow-hidden border-2 border-indigo-200 mx-auto bg-slate-100 flex items-center justify-center">
                <img id="preview-perfil" src="" class="w-full h-full object-cover">
              </div>
              <input type="file" name="foto_perfil" accept="image/*" class="w-full text-xs text-slate-500 border border-slate-200 p-2 rounded-lg bg-white" onchange="previewImage(event, 'preview-perfil', 'preview-perfil-container')">
            </div>

            <!-- ESTADO DE ADOPCIÓN (SE MUESTRA EN SEGUIMIENTOS Y RESCATES) -->
            <div id="caja-adopcion" class="hidden mt-4 pt-4 border-t border-slate-200">
              <label class="block text-sm font-bold mb-1 text-slate-800">Estado / Disponibilidad</label>
              <select name="adopcion_status" id="select-adopcion" class="w-full border rounded-lg p-2.5 outline-none bg-emerald-50 text-emerald-800 font-bold">
                <option value="En Observación">En Observación (Tratamiento)</option>
                <option value="Listo para Adopción">Sano - Listo para Adopción</option>
                <option value="Mascota Externa">Mascota Externa (Con Dueño)</option>
              </select>
            </div>
          </div>
          
          <!-- COLUMNA 2: CLÍNICA -->
          <div class="md:col-span-8 space-y-6">
            <h4 class="font-bold text-sm text-indigo-700 uppercase tracking-widest border-b border-indigo-100 pb-2 mb-4">2. Evaluación Clínica Actual</h4>
            <div class="grid grid-cols-3 gap-4">
              <div><label class="block text-sm font-bold mb-1 text-slate-800">Temp (°C)</label><input type="text" name="temp" id="form-temp" placeholder="Ej. 38.5" class="w-full border rounded-lg p-2.5 outline-none"></div>
              <div><label class="block text-sm font-bold mb-1 text-slate-800">Peso (Kg)</label><input type="text" name="peso" id="form-peso" placeholder="Ej. 12.5" class="w-full border rounded-lg p-2.5 outline-none"></div>
              
              <!-- EVIDENCIA FOTOGRÁFICA MÚLTIPLE CON X PARA BORRAR -->
              <div>
                <label class="block text-sm font-bold mb-1 text-slate-800">Evidencia (Fotos)</label>
                <!-- Atributo name="evidencia_fotos" atrapa las imágenes al enviar -->
                <input type="file" id="input-evidencia" name="evidencia_fotos" multiple accept="image/*" class="w-full border border-slate-300 rounded-lg p-1.5 text-xs bg-white text-slate-500" onchange="handleEvidencia(event)">
              </div>
            </div>
            
            <!-- Visor Inteligente de Evidencia -->
            <div id="preview-evidencia-container" class="flex gap-3 overflow-x-auto pb-2 min-h-[10px] mt-2"></div>

            <div class="mt-4">
              <label class="block text-sm font-bold mb-1 text-slate-800">Síntomas Visualizados</label>
              <div class="flex gap-2">
                <input type="text" id="input-sintoma" placeholder="Ej. Cojera, fiebre..." class="w-full border rounded-lg p-2.5 outline-none" onkeypress="if(event.key === 'Enter') { event.preventDefault(); addSintoma(); }">
                <button type="button" onclick="addSintoma()" class="bg-indigo-600 text-white font-bold px-6 rounded-lg">Añadir</button>
              </div>
              <div id="contenedor-sintomas" class="flex flex-wrap gap-2 mt-3 min-h-[30px]"></div>
            </div>

            <div class="grid grid-cols-2 gap-4 mt-2">
              <div><label class="block text-sm font-bold mb-1 text-slate-800">Diagnóstico</label><textarea name="diagnostico" rows="4" data-regla="clinico" data-max="150" data-requerido data-etiqueta="El diagnóstico" placeholder="Ej. Infección urinaria" class="w-full border rounded-lg p-2.5 outline-none"></textarea></div>
              <div><label class="block text-sm font-bold mb-1 text-slate-800">Tratamiento / Receta</label><textarea name="tratamiento" rows="4" data-regla="clinico" data-max="200" data-requerido data-etiqueta="El tratamiento" placeholder="Ej. Trimetoprim-12 horas-3 dias" class="w-full border rounded-lg p-2.5 outline-none"></textarea></div>
            </div>
            
            <!-- SISTEMA DE VACUNAS Y FRECUENCIAS PERSONALIZADAS -->
            <div class="border border-emerald-300 rounded-xl bg-emerald-50/30 overflow-hidden">
              <h4 class="font-bold text-sm text-emerald-700 uppercase bg-emerald-100/50 px-5 py-3 border-b border-emerald-200">Sistema de Vacunación / Medicación</h4>
              <div class="p-5">
                
                <!-- AQUÍ SE INYECTAN LAS VACUNAS PASADAS AL HACER CLIC EN SEGUIMIENTO -->
                <div id="historial-vacunas-previas"></div>

                <div class="grid grid-cols-12 gap-4 items-start mt-4">
                  <div class="col-span-5">
                    <label class="block text-xs font-bold mb-1 text-emerald-800">Nueva Dosis / Refuerzo</label>
                    <input type="text" id="input-vacuna" placeholder="Ej. Rabia..." class="w-full border border-emerald-200 rounded-lg p-2 outline-none">
                  </div>
                  
                  <!-- Select con nuevas frecuencias -->
                  <div class="col-span-5">
                    <label class="block text-xs font-bold mb-1 text-emerald-800">Frecuencia</label>
                    <select id="select-frecuencia" onchange="togglePersonalizado()" class="w-full border border-emerald-200 rounded-lg p-2 outline-none bg-white">
                      <option value="Semanal">Semanal</option>
                      <option value="Quincenal">Quincenal</option>
                      <option value="Mensual">Mensual</option>
                      <option value="Cada 3 Meses">Cada 3 Meses</option>
                      <option value="Cada 6 Meses">Cada 6 Meses</option>
                      <option value="Cada 8 Meses">Cada 8 Meses</option>
                      <option value="Anual">Anual</option>
                      <option value="Personalizado">Personalizado (Días)</option>
                    </select>
                    <!-- Cajita oculta para días personalizados -->
                    <div id="caja-personalizado" class="hidden mt-2 flex items-center gap-2">
                        <input type="number" id="input-personalizado-dias" placeholder="Ej. 10" class="w-full border border-emerald-200 rounded-lg p-1.5 text-xs outline-none bg-white shadow-inner">
                        <span class="text-xs font-bold text-emerald-700">días</span>
                    </div>
                  </div>
                  
                  <div class="col-span-2">
                    <button type="button" onclick="addVacuna()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg transition h-[38px] mt-[18px] flex items-center justify-center shadow-sm">
                      <i data-lucide="plus" class="w-5 h-5"></i>
                    </button>
                  </div>
                </div>
                <div id="lista-vacunas" class="mt-4 space-y-2"></div>
              </div>
            </div>
            
            <div id="resumen-errores" class="hidden mb-4 p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-sm"></div>

            <div class="pt-4 flex flex-col items-end gap-2">
              <button type="button" id="btn-guardar-expediente" onclick="validarYEnviarConsulta()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-10 rounded-xl shadow-md transition text-lg disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-indigo-600">Guardar Expediente</button>
              <p id="msg-guardar" class="text-xs font-semibold text-amber-600 text-right"></p>
            </div>
            
          </div>
        </div>
      </form>
    </div>
  </div>
