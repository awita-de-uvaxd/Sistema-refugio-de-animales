<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huellitas de Amor - Sistema Modular</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .scroll-hide::-webkit-scrollbar { display: none; }
    .custom-scroll::-webkit-scrollbar { width: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* Estilos base para formularios extensos */
    .form-extenso fieldset { border: 1px solid #dcdfe6; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fafafa; }
    .form-extenso legend { font-weight: bold; color: #4f46e5; padding: 0 10px; font-size: 1.1em; }
    .form-extenso label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.9em; color: #334155; }
    .form-extenso input[type="text"], .form-extenso input[type="tel"], .form-extenso input[type="email"], .form-extenso input[type="number"], .form-extenso input[type="date"], .form-extenso select, .form-extenso textarea { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9em; background-color: #fff; outline: none; }
    .form-extenso .options-group { margin-top: 8px; }
    .form-extenso .options-group label { display: block; font-weight: normal; margin-top: 6px; cursor: pointer; color: #475569; }
    .form-extenso .urgent-box { background-color: #fee2e2; border-left: 5px solid #ef4444; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- MODAL GLOBAL -->
  <div id="global-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto relative custom-scroll">
      <button onclick="closeModal()" class="sticky top-4 left-[calc(100%-3rem)] bg-slate-100 hover:bg-slate-200 p-2 rounded-full text-slate-600 transition z-50">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div id="modal-content" class="p-6 pt-2"></div>
    </div>
  </div>

  <!-- HEADER CON RUTAS FLASK -->
  <header class="bg-indigo-950 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-amber-400 p-2 rounded-xl text-indigo-950"><i data-lucide="paw-print" class="w-6 h-6"></i></div>
        <div>
          <h1 class="font-bold text-xl leading-none tracking-tight">Huellitas de Amor</h1>
          <span class="text-xs text-indigo-300">Plataforma Modular v4.0</span>
        </div>
      </div>
      <div class="flex items-center gap-1 bg-indigo-900/50 p-1.5 rounded-lg border border-indigo-800 flex-wrap justify-center">
        <!-- OJO: Agregado un if para marcar la página activa -->
        <a href="{{ url_for('rescatista') }}" class="px-4 py-1.5 text-xs font-semibold rounded-md transition {% if request.path == '/rescatista' %}bg-amber-400 text-indigo-950 shadow-md{% else %}text-indigo-300 hover:text-white hover:bg-indigo-800{% endif %}">Rescatista</a>
        <a href="{{ url_for('veterinario') }}" class="px-4 py-1.5 text-xs font-semibold rounded-md transition {% if request.path == '/veterinario' %}bg-amber-400 text-indigo-950 shadow-md{% else %}text-indigo-300 hover:text-white hover:bg-indigo-800{% endif %}">Veterinario</a>
        <a href="{{ url_for('usuario') }}" class="px-4 py-1.5 text-xs font-semibold rounded-md transition {% if request.path == '/usuario' %}bg-amber-400 text-indigo-950 shadow-md{% else %}text-indigo-300 hover:text-white hover:bg-indigo-800{% endif %}">Usuario</a>
        <a href="{{ url_for('admin') }}" class="px-4 py-1.5 text-xs font-semibold rounded-md transition {% if request.path == '/admin' %}bg-amber-400 text-indigo-950 shadow-md{% else %}text-indigo-300 hover:text-white hover:bg-indigo-800{% endif %}">Admin</a>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DINÁMICO -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- NOTA DE ADVERTENCIA PARA EL PROTOTIPO -->
    <div class="bg-indigo-50 border-l-4 border-indigo-500 text-indigo-800 p-4 mb-4 text-xs rounded shadow-sm flex justify-between items-center">
      <div>
        <p class="font-bold">Modo de Memoria Local Activado:</p>
        <p>Los datos ahora se guardan en el navegador. Si pasas de una pestaña a otra, la información no se perderá.</p>
      </div>
      <button onclick="limpiarMemoria()" class="bg-indigo-200 hover:bg-indigo-300 text-indigo-900 px-3 py-1.5 rounded font-bold shadow-sm transition">Restaurar Valores de Fábrica</button>
    </div>

    <!-- AQUÍ SE INYECTARÁ EL CÓDIGO DE CADA PANTALLA -->
    {% block content %}
    {% endblock %}

  </main>

  <!-- TEMPLATES OCULTOS PARA MODALES DE VOLUNTARIADO -->
  <template id="tpl-vol-temporal">
    <h3 class="font-bold text-2xl text-indigo-900 mb-4 border-b pb-2">Registro: Apoyo Temporal y Socialización</h3>
    <form onsubmit="enviarVoluntariadoReal(event, 'temporal')" class="space-y-5 bg-slate-50 p-6 rounded-xl border form-extenso">
      <fieldset>
        <legend>1. Información General</legend>
        <label>Nombre completo:</label><input type="text" name="nombre" required>
        <label>Teléfono:</label><input type="tel" name="telefono" required>
        <label>Horas disponibles al día:</label><input type="text" name="horas_disponibles" placeholder="Ej. 2 a 3 horas" required>
      </fieldset>
      <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-md transition text-lg mt-4 hover:bg-indigo-700">Enviar Registro</button>
    </form>
  </template>

  <template id="tpl-vol-cafe">
    <h3 class="font-bold text-2xl text-indigo-900 mb-4 border-b pb-2">Cuestionario de Aptitud y Convivencia Animal</h3>
    <form onsubmit="enviarVoluntariadoReal(event, 'cafe')" class="space-y-5 bg-slate-50 p-6 rounded-xl border form-extenso">
      <fieldset>
        <legend>1. Datos Personales</legend>
        <label>Nombre completo:</label><input type="text" name="nombre" required>
        <label>Teléfono:</label><input type="tel" name="telefono" required>
      </fieldset>
      <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-md transition text-lg mt-4 hover:bg-indigo-700">Enviar Cuestionario</button>
    </form>
  </template>

  <template id="tpl-vol-refugio">
    <h3 class="font-bold text-2xl text-indigo-900 mb-4 border-b pb-2">Solicitud de Voluntariado Operativo</h3>
    <form onsubmit="enviarVoluntariadoReal(event, 'refugio')" class="space-y-5 bg-slate-50 p-6 rounded-xl border form-extenso">
      <fieldset>
        <legend>1. Datos del Solicitante</legend>
        <label>Nombre completo:</label><input type="text" name="nombre" required>
        <label>Teléfono:</label><input type="tel" name="telefono" required>
      </fieldset>
      <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-md transition text-lg mt-4 hover:bg-indigo-700">Postularme</button>
    </form>
  </template>

  <!-- LÓGICA GIGANTE DE LA BASE DE DATOS Y FUNCIONES JS -->
  <script>
    // ================= ESTADO COMPARTIDO (BASE DE DATOS EN MEMORIA LOCAL) =================
    const today = new Date();
    const isoHoy = today.toISOString().split('T')[0];
    const localHoy = today.toLocaleDateString();

    const DB_INICIAL = {
      sesionActual: { rol: 'rescatista', nombre: 'Carlos G.', correo: 'carlos@huellitas.com' },
      idCounter: 1005,
      especies: ['Perro', 'Gato', 'Ave', 'Conejo', 'Caballo'],
      cmsDonaciones: { titulo: "Apoya la Causa", sub: "Aceptamos donaciones monetarias o insumos físicos (alimentos, cobijas, juguetes).", banco: "Banco Nacional: Cuenta Monetaria #000-123456-7", nombre: "A Nombre De: Asociación Huellitas de Amor", sede: "Sede Recepción Comida: Calle Principal 12-45 Zona 10" },
      cmsVoluntariado: [
        { id: 'temporal', titulo: '1. Hogar Temporal de Socialización', sub: 'Mantén un perrito del albergue en tu casa temporalmente.', texto: "Al ser hogar temporal ayudas a evaluar el comportamiento del animal en un ambiente familiar, lo cual facilita encontrarle la familia perfecta.", fotos: [] },
        { id: 'cafe', titulo: '2. Convivencia y Terapia', sub: 'Visita instalaciones para compartir tiempo y jugar.', texto: "Pasa tiempo de calidad jugando y acariciando a los animalitos. Esto reduce su estrés.", fotos: [] },
        { id: 'refugio', titulo: '3. Apoyo Directo en Refugio', sub: 'Ayuda operacional (Apto tareas ligeras jóvenes/niños).', texto: "Ideal para trabajo físico. Nos ayudas a limpiar recintos, preparar dietas y paseos rutinarios.", fotos: [] }
      ],
      alertas: [], 
      rescates: [
        { id: 1001, direccion: "Zona 1", especie: "Perro", sexo: "Macho", gravedad: "Grave", color: "Negro", desc: "Atropellado", fotos: ["https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200"], estado: "Atendido", rescatista: "Carlos G." },
        { id: 1002, direccion: "Parque Central", especie: "Gato", sexo: "Hembra", gravedad: "Media", color: "Blanco", desc: "En un árbol", fotos: [], estado: "Pendiente", rescatista: "Carlos G." }
      ],
      pacientes: [
        { id: 1001, nombre: "Bucky", especie: "Perro", sexo: "Macho", foto: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200", duenoActual: "Ana L.", disponibleAdopcion: "No",
          consultas: [{ fecha: localHoy, temp: "38.5", peso: "12", sintomas: ["vomitos y diarrea"], diag: "Fractura leve e indigestión", trat: "trimetroprin cada 8 horas", fotos: ["https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=200"], vacunas: [{nom: "Rabia", freq: "Anual"}], veterinario: "Dra. María" }] },
        { id: 1002, nombre: "Rescatado #1002", especie: "Gato", sexo: "Hembra", foto: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=200", duenoActual: null, disponibleAdopcion: "Si", consultas: [] }
      ],
      citas: [ { pId: 1001, rawDate: isoHoy, fecha: localHoy, motivo: "Revisión General" } ],
      shop: [{ id: 1, nom: "Collar Rojo Especial", precio: 45, desc: "Collar ajustable reforzado", foto: "https://images.unsplash.com/photo-1601758228041-f3b2795255f1?w=200" }],
      pedidos: [],
      solicitudesAdopcion: [{ idReq: 1, pId: 1002, usuario: "Ana L.", form: { ocu: "Maestra", sue: "Q5,000", esp: "Casa con patio", tie: "2 horas", exp: "Tuve perros antes", vet: "Dr. Perez", fotos: ["https://images.unsplash.com/photo-1588880331179-bc9b93a8cb65?w=100"], fullData: { "ocupacion": "Maestra", "sueldo": "Q5,000" } } }],
      solicitudesReclamo: [], 
      solicitudesVoluntariado: [],
      formBaseAdoptante: null,
      staff: { rescatistas: [{nombre: 'Carlos G.'}, {nombre: 'Luis F.'}], veterinarios: [{nombre: 'Dra. María'}, {nombre: 'Dr. Juan'}] }
    };

    // MAGIA: CARGAR DATOS DEL NAVEGADOR
    let DB = JSON.parse(localStorage.getItem('HUELLITAS_DB')) || DB_INICIAL;

    // MAGIA: FUNCION PARA GUARDAR CAMBIOS
    function sincronizarDB() {
      localStorage.setItem('HUELLITAS_DB', JSON.stringify(DB));
    }

    // Botón para resetear si la base de datos se traba
    function limpiarMemoria() {
      localStorage.removeItem('HUELLITAS_DB');
      alert("Memoria borrada. La página se recargará con los datos de fábrica.");
      location.reload();
    }

    let sintomasTemp = [], vacunasTemp = [];

    // ================= FUNCIONES DE UTILIDAD COMUNES =================
    const getEl = id => document.getElementById(id);
    const toDataURL = file => new Promise(r => { const reader = new FileReader(); reader.onload = () => r(reader.result); reader.readAsDataURL(file); });
    const getUrls = async files => { const a = []; for(const f of files) a.push(await toDataURL(f)); return a; };
    
    function openModal(html) { getEl('modal-content').innerHTML = html; getEl('global-modal').classList.remove('hidden'); lucide.createIcons(); }
    const closeModal = () => getEl('global-modal').classList.add('hidden');
    const closeMod = () => closeModal();

    function switchTab(role, tabId) {
      document.querySelectorAll(`.tab-content-${role}`).forEach(el => el.classList.remove('active'));
      document.querySelectorAll(`.tab-btn-${role}`).forEach(btn => { btn.classList.remove('border-indigo-600', 'text-indigo-600'); btn.classList.add('border-transparent', 'text-slate-500'); });
      const target = getEl(`${role}-${tabId}`);
      if(target) target.classList.add('active');
      const activeBtn = document.querySelector(`.tab-btn-${role}[data-tab="${tabId}"]`);
      if(activeBtn) { activeBtn.classList.remove('border-transparent', 'text-slate-500'); activeBtn.classList.add('border-indigo-600', 'text-indigo-600'); }
    }

    function generarFormulariosPerfil() {
      const html = `
        <div class="bg-white rounded-2xl shadow-sm p-8 max-w-lg mx-auto border border-slate-100">
          <div class="flex items-center justify-between mb-6 border-b pb-4">
            <h3 class="font-bold text-xl">Configuración de Perfil</h3>
            <button onclick="alert('Cerrando sesión (Simulado)...')" class="text-red-500 hover:text-red-700 flex gap-1 items-center text-sm font-bold"><i data-lucide="log-out" class="w-4 h-4"></i> Salir</button>
          </div>
          <form onsubmit="event.preventDefault(); alert('Perfil guardado');" class="space-y-4 text-sm">
            <div class="flex items-center gap-4 mb-4"><div class="w-20 h-20 bg-slate-200 rounded-full flex items-center justify-center overflow-hidden"><i data-lucide="camera" class="text-slate-400"></i></div><input type="file" class="text-xs"></div>
            <div class="grid grid-cols-2 gap-4"><div><label class="font-bold block mb-1">Nombre</label><input type="text" value="${DB.sesionActual.nombre}" class="w-full border rounded-lg p-2"></div><div><label class="font-bold block mb-1">Teléfono</label><input type="text" class="w-full border rounded-lg p-2"></div></div>
            <div><label class="font-bold block mb-1">Correo Electrónico</label><input type="email" value="${DB.sesionActual.correo}" class="w-full border rounded-lg p-2"></div>
            <div><label class="font-bold block mb-1">Nueva Contraseña</label><input type="password" class="w-full border rounded-lg p-2"></div>
            <div><label class="font-bold block mb-1">Dirección</label><input type="text" class="w-full border rounded-lg p-2"></div>
            <div><label class="font-bold block mb-1">Descripción / Bio</label><textarea rows="2" class="w-full border rounded-lg p-2"></textarea></div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">Guardar Cambios</button>
          </form>
        </div>
      `;
      document.querySelectorAll('.profile-container').forEach(el => el.innerHTML = html);
      lucide.createIcons();
    }

    // ================= FUNCIONES RESCATISTA =================
    function renderEspecies() {
      const s = getEl('res-especie-select');
      if(s) s.innerHTML = DB.especies.map(e => `<option value="${e}">${e}</option>`).join('') + '<option value="otra">Añadir especie...</option>';
    }

    function toggleNuevaEspecie() {
      const sel = getEl('res-especie-select'), inp = getEl('res-especie-nueva');
      if(sel && sel.value === 'otra') { inp.classList.remove('hidden'); inp.required = true; } 
      else if(inp) { inp.classList.add('hidden'); inp.required = false; }
    }

    function renderRescatista() {
      const idEl = getEl('res-id-asignado');
      if(idEl) idEl.innerText = "#" + DB.idCounter;
      renderEspecies();
      const alertasEl = getEl('lista-alertas-rescatista');
      if(alertasEl) alertasEl.innerHTML = DB.alertas.map((a, i) => `
        <div class="border border-red-200 bg-red-50/50 p-5 rounded-xl flex flex-col justify-between">
          <div><p class="text-sm font-bold mb-1"><i data-lucide="map-pin" class="w-4 h-4 inline text-red-500"></i> ${a.dir}</p><p class="text-xs text-slate-700 line-clamp-2 mb-3">${a.desc}</p></div>
          <button onclick="verDetalleAlerta(${i})" class="w-full bg-white border border-red-300 text-red-600 font-bold py-2 rounded-lg text-sm hover:bg-red-50 transition">Ver Fotografías y Detalle</button>
        </div>
      `).join('') || '<p class="text-sm text-slate-500">No hay alertas ciudadanas nuevas.</p>';

      const rescatesEl = getEl('lista-mis-rescates');
      if(rescatesEl) rescatesEl.innerHTML = DB.rescates.filter(r => r.rescatista === DB.sesionActual.nombre).map(r => `
        <div class="border p-5 rounded-xl bg-slate-50 flex gap-4 items-start">
          ${r.fotos && r.fotos[0] ? `<img src="${r.fotos[0]}" class="w-20 h-20 rounded-lg object-cover">` : '<div class="w-20 h-20 bg-slate-200 rounded-lg"></div>'}
          <div class="w-full">
            <div class="flex justify-between font-bold mb-1"><span>Ficha #${r.id}</span><span class="text-indigo-600 text-xs bg-indigo-100 px-2 py-0.5 rounded">${r.estado}</span></div>
            <p class="text-xs text-slate-600"><strong>${r.especie}</strong> - ${r.sexo} | Gravedad: ${r.gravedad}</p>
            <p class="text-xs text-slate-600 mt-1"><strong>Lugar:</strong> ${r.direccion}</p>
          </div>
        </div>
      `).join('') || '<p class="text-sm">No has realizado rescates aún.</p>';
    }

    function verDetalleAlerta(idx) {
      const a = DB.alertas[idx];
      if(!a) return;
      const fotosHtml = a.fotos && a.fotos.length > 0 ? a.fotos.map(f => `<img src="${f}" class="h-48 rounded-lg object-cover shadow-sm border">`).join('') : '<p class="text-slate-500 text-sm">El usuario no adjuntó fotografías.</p>';
      openModal(`
        <h3 class="font-bold text-xl text-red-600 mb-4">Evaluación de Alerta Ciudadana</h3>
        <div class="flex gap-3 overflow-x-auto pb-4 scroll-hide border-b mb-4">${fotosHtml}</div>
        <p class="text-sm mb-2"><strong>Dirección reportada:</strong> ${a.dir}</p>
        <p class="text-sm mb-6 bg-slate-50 p-3 rounded-lg border"><strong>Descripción:</strong> ${a.desc}</p>
        <div class="grid grid-cols-2 gap-4">
          <button onclick="tomarAlerta(${idx})" class="bg-indigo-600 text-white font-bold py-3 rounded-xl">Tomar Caso (Crear Ficha)</button>
          <button onclick="descartarAlerta(${idx})" class="bg-slate-200 text-slate-700 font-bold py-3 rounded-xl hover:bg-slate-300">Marcar como Falsa Alarma</button>
        </div>
      `);
    }

    function tomarAlerta(idx) {
      const a = DB.alertas[idx];
      switchTab('rescatista', 'nuevo');
      getEl('res-direccion').value = a.dir; getEl('res-desc').value = a.desc;
      DB.alertas.splice(idx, 1); 
      sincronizarDB(); 
      closeMod(); renderRescatista();
    }
    
    function descartarAlerta(idx) { 
      DB.alertas.splice(idx, 1); 
      sincronizarDB(); 
      closeMod(); renderRescatista(); 
    }

    async function guardarNuevoRescate(e) {
      e.preventDefault();
      const espSelect = getEl('res-especie-select').value;
      const especieFinal = espSelect === 'otra' ? getEl('res-especie-nueva').value : espSelect;
      if(espSelect === 'otra' && !DB.especies.includes(especieFinal)) DB.especies.push(especieFinal);
      const fotos = await getUrls(getEl('res-fotos').files);
      const r = { id: DB.idCounter++, direccion: getEl('res-direccion').value, especie: especieFinal, sexo: getEl('res-sexo').value, gravedad: getEl('res-gravedad').value, color: getEl('res-color').value, desc: getEl('res-desc').value, fotos, estado: 'Pendiente', rescatista: DB.sesionActual.nombre };
      DB.rescates.push(r);
      
      sincronizarDB();
      alert(`Ficha #${r.id} generada y enviada a Veterinaria.`);
      e.target.reset(); getEl('res-especie-nueva').classList.add('hidden'); renderRescatista();
    }

    // ================= FUNCIONES VETERINARIO =================
    function filtrarCitasPorFecha(selectId) {
      const el = getEl(selectId);
      if(!el) return [];
      const filtro = el.value;
      const mHoy = new Date(); mHoy.setHours(0,0,0,0);
      let limite = new Date(mHoy);
      if(filtro === 'semana') limite.setDate(limite.getDate() + 7);
      else if(filtro === 'quincena') limite.setDate(limite.getDate() + 14);
      else if(filtro === 'mes') limite.setMonth(limite.getMonth() + 1);

      return DB.citas.filter(c => {
         if(filtro === 'todas') return true;
         const cDate = new Date(c.rawDate + 'T00:00:00');
         if(filtro === 'hoy') return cDate.getTime() === mHoy.getTime();
         return cDate >= mHoy && cDate <= limite;
      });
    }

    function renderCitasInicio() {
      const citas = filtrarCitasPorFecha('filtro-citas-inicio');
      const container = getEl('lista-citas-hoy');
      if(container) container.innerHTML = citas.map(c => `
        <div class="flex justify-between items-center border-b pb-3"><div class="text-sm"><p class="font-bold">ID #${c.pId} <span class="text-xs text-slate-500 font-normal">(${c.fecha})</span></p><p class="text-xs text-slate-600 mt-1">${c.motivo}</p></div><button onclick="iniciarConsultaExistente(${c.pId})" class="bg-amber-100 text-amber-700 px-4 py-1.5 text-xs font-bold rounded-lg hover:bg-amber-200">Atender</button></div>
      `).join('') || '<p class="text-sm text-slate-500 italic mt-4">No hay citas para este periodo.</p>';
    }

    function renderCitasGeneral() {
      const citas = filtrarCitasPorFecha('filtro-citas-general');
      const container = getEl('todas-citas-vet');
      if(container) container.innerHTML = citas.map((c, i) => `
        <div class="border border-slate-200 p-4 rounded-xl bg-white shadow-sm flex justify-between items-center text-sm">

    function iniciarConsultaExistente(id) {
      const p = DB.pacientes.find(x => x.id === id);
      if(!p) return;
      switchTab('veterinario', 'nueva');
      getEl('titulo-consulta').innerText = "Consulta de Seguimiento";
      getEl('subtitulo-consulta').innerText = `Expediente Existente: #${p.id} - ${p.nombre}`;
      getEl('vet-id-asignado').innerText = p.id;
      getEl('vet-paciente-id').value = p.id; getEl('vet-es-privado').value = p.duenoActual ? "true" : "false";
      if(p.duenoActual || p.disponibleAdopcion === "Si") getEl('box-adopcion').classList.add('hidden'); else getEl('box-adopcion').classList.remove('hidden');
      limpiarForm();
      getEl('vet-nombre').value = p.nombre; getEl('vet-especie').value = p.especie; getEl('vet-sexo').value = p.sexo;
      getEl('vet-especie').readOnly = true; getEl('vet-especie').className = "w-full border rounded-lg p-2.5 bg-slate-100";
      getEl('vet-current-photo').src = p.foto;

      const vacunasHist = [];
      p.consultas.forEach(c => { if(c.vacunas) vacunasHist.push(...c.vacunas); });
      if(vacunasHist.length > 0) {
        getEl('box-vacunas-historicas').classList.remove('hidden');
        getEl('lista-vacunas-historicas').innerHTML = vacunasHist.map(v => `
          <li class="flex justify-between items-center border-b pb-1">
            <span>• <strong>${v.nom}</strong> (${v.freq})</span>
            <button type="button" onclick="aplicarRefuerzo('${v.nom}')" class="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded-md font-bold hover:bg-indigo-200">Aplicar Refuerzo</button>
          </li>
        `).join('');
      }
    }

    function aplicarRefuerzo(nom) {
      getEl('vac-nombre').value = nom + ' (Refuerzo)';
      getEl('vac-freq-select').focus();
    }

    function limpiarForm() {
      getEl('vet-temp').value=''; getEl('vet-peso').value=''; getEl('vet-diag').value=''; getEl('vet-trat').value=''; getEl('vet-foto').value=''; getEl('vet-fotos-consulta').value='';
      getEl('box-vacunas-historicas').classList.add('hidden'); getEl('lista-vacunas-historicas').innerHTML = '';
      sintomasTemp = []; vacunasTemp = []; updListas();
    }

    function agregarSintoma() { const s = getEl('input-sintoma').value; if(s){ sintomasTemp.push(s); getEl('input-sintoma').value=''; updListas(); } }
    function borrarSintoma(i) { sintomasTemp.splice(i,1); updListas(); }
    function agregarVacuna() { 
      const n = getEl('vac-nombre').value, fSel = getEl('vac-freq-select').value;
      const f = fSel === 'Personalizado' ? getEl('vac-freq-custom').value : fSel;
      if(n){ vacunasTemp.push({nom: n, freq: f}); getEl('vac-nombre').value=''; getEl('vac-freq-custom').value=''; updListas(); }

    function updListas() {
      getEl('lista-sintomas-tags').innerHTML = sintomasTemp.map((s, i) => `<span class="bg-red-100 text-red-700 text-xs px-3 py-1 rounded-full font-bold flex items-center gap-1">${s} <button type="button" onclick="borrarSintoma(${i})"><i data-lucide="x" class="w-3 h-3 hover:text-red-900 transition"></i></button></span>`).join('');
      getEl('lista-vacunas-aplicadas').innerHTML = vacunasTemp.map((v, i) => `<li class="flex items-center gap-2">• <strong>${v.nom}</strong> (Frecuencia: ${v.freq}) <button type="button" onclick="vacunasTemp.splice(${i},1); updListas();" class="text-red-500 hover:text-red-700 text-xs ml-2"><i data-lucide="trash" class="w-3 h-3"></i></button></li>`).join('');

    async function guardarConsultaMedica(e) {
      e.preventDefault();
      const idIn = getEl('vet-paciente-id').value;
      const id = idIn ? parseInt(idIn) : DB.idCounter++;
      let p = DB.pacientes.find(x => x.id === id);

      const fPerfilFile = getEl('vet-foto').files;
      const fConsul = await getUrls(getEl('vet-fotos-consulta').files);

      let fotoPerfilUrl = p ? p.foto : "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200"; 
      if (fPerfilFile.length > 0) {
        const urlsP = await getUrls(fPerfilFile);
        fotoPerfilUrl = urlsP[0];
      }

      const c = { fecha: localHoy, temp: getEl('vet-temp').value, peso: getEl('vet-peso').value, sintomas: [...sintomasTemp], diag: getEl('vet-diag').value, trat: getEl('vet-trat').value, fotos: fConsul, vacunas: [...vacunasTemp], veterinario: DB.sesionActual.nombre };

      if(!p) {
        p = { id, nombre: getEl('vet-nombre').value, especie: getEl('vet-especie').value, sexo: getEl('vet-sexo').value, foto: fotoPerfilUrl, duenoActual: getEl('vet-es-privado').value === "true" ? "Externo" : null, disponibleAdopcion: "No", consultas: [] };
        DB.pacientes.push(p);
      } else {
        p.nombre = getEl('vet-nombre').value;
        p.foto = fotoPerfilUrl;
        if(!p.duenoActual) p.disponibleAdopcion = getEl('vet-adopcion').value;
      }
      p.consultas.push(c);

      const r = DB.rescates.find(x => x.id === id);
      if(r && r.estado === 'Pendiente') r.estado = 'Atendido';

      DB.citas = DB.citas.filter(cita => cita.pId !== id);

      sincronizarDB();
      alert(`Expediente guardado con éxito. ID Asignado/Actualizado: #${id}`);
      switchTab('veterinario', 'buscar'); renderVeterinario();
    }

      getEl('lista-busqueda-vet').innerHTML = DB.pacientes.filter(p => p.id.toString().includes(q) || p.nombre.toLowerCase().includes(q)).map(p => `

      openModal(`

    function abrirCita(id) {
      openModal(`
        <h3 class="font-bold text-xl mb-4 text-indigo-900 flex items-center gap-2"><i data-lucide="calendar-plus"></i> Agendar Cita (Paciente #${id})</h3>

    function guardarCita(e, id) {

      DB.citas.push({ pId: id, rawDate: rawD, fecha: new Date(p[0], p[1]-1, p[2]).toLocaleDateString(), motivo: getEl('c-m').value }); 
      
      sincronizarDB();

    function verPerfilAdopcion(id) {
      const p = DB.pacientes.find(x => x.id === id);
      if(!p) return;
      const rescate = DB.rescates.find(r => r.id === id);

      let todasLasFotos = [p.foto];
      if (rescate && rescate.fotos && rescate.fotos.length > 0) todasLasFotos = todasLasFotos.concat(rescate.fotos);
      if (p.consultas && p.consultas.length > 0) p.consultas.forEach(c => { if(c.fotos && c.fotos.length > 0) todasLasFotos = todasLasFotos.concat(c.fotos); });

      const ultimoDiag = (p.consultas && p.consultas.length > 0) ? p.consultas[p.consultas.length - 1].diag : 'Sin registro clínico';
      const ultimoTrat = (p.consultas && p.consultas.length > 0) ? p.consultas[p.consultas.length - 1].trat : 'Sin tratamiento';

      const galeriaHtml = todasLasFotos.map(f => `<img src="${f}" class="h-40 w-auto rounded-xl object-cover shadow-sm border-2 border-white">`).join('');

      openModal(`
        <div class="flex flex-col md:flex-row gap-8 mb-6">
          <div class="w-full md:w-1/3"><img src="${p.foto}" class="w-full rounded-3xl object-cover shadow-md border-4 border-white"></div>
          <div class="w-full md:w-2/3 flex flex-col justify-center space-y-4">
            <div>
              <h2 class="text-4xl font-black text-indigo-950 leading-none mb-2">#${p.id} - ${p.nombre}</h2>
              <span class="text-sm font-bold text-indigo-600 bg-indigo-50 px-4 py-1.5 rounded-full border border-indigo-100">${p.especie} • ${p.sexo}</span>
            </div>
            <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 text-sm shadow-inner mt-4">
              <p class="font-bold text-indigo-900 border-b border-indigo-200 pb-2 mb-3 text-lg"><i data-lucide="file-heart" class="inline w-5 h-5 mr-1 text-rose-500"></i> Resumen Clínico Actualizado</p>
              <p class="mb-2 text-slate-700"><strong>Último Diagnóstico Médico:</strong> ${ultimoDiag}</p>
              <p class="text-slate-700"><strong>Último Tratamiento/Receta:</strong> ${ultimoTrat}</p>
            </div>
          </div>
        </div>
        <h4 class="font-bold text-xl text-slate-800 mb-4 border-b pb-2"><i data-lucide="images" class="inline w-5 h-5 mr-2 text-indigo-500"></i> Galería Histórica de Fotografías</h4>
        <div class="flex gap-4 overflow-x-auto pb-6 scroll-hide mb-6 bg-slate-50 p-4 rounded-2xl border custom-scroll">
          ${galeriaHtml}
        </div>
        <div class="flex flex-col gap-3">
          <button onclick="solicitarAdopcion(${p.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-md transition text-lg flex items-center justify-center gap-2">
            <i data-lucide="heart-handshake" class="w-6 h-6"></i> Solicitar Adopción (Con mi formulario)
          </button>
          <div class="border-t border-slate-200 pt-6 mt-6">
            <p class="text-sm text-slate-500 text-center mb-3 font-semibold">¿Reconoces a este animal como tuyo y se había extraviado?</p>
            <button onclick="mostrarFormularioReclamo(${p.id})" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 shadow-sm border border-slate-300">
              <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600"></i> Realizar Reclamo de Propiedad Legítima
            </button>
          </div>
        </div>
      `);

    function mostrarFormularioReclamo(id) {
      openModal(`
        <h3 class="font-bold text-2xl mb-2 text-red-600 flex items-center gap-2 border-b pb-2"><i data-lucide="shield-alert" class="w-6 h-6"></i> Reclamo de Propiedad (ID #${id})</h3>

    async function enviarReclamo(e, id) {
      e.preventDefault();
      const fotos = await getUrls(getEl('rec-fotos').files);
      DB.solicitudesReclamo.push({ id: Date.now(), pId: id, usuario: DB.sesionActual.nombre, nombreResp: getEl('rec-nom').value, marcas: getEl('rec-marcas').value, fotos: fotos });
      
      sincronizarDB();
      alert('Evidencia recibida exitosamente. Su reclamo ha sido enviado al departamento de revisión legal y pronto lo verá el Administrador.');
      closeModal();
    }

    function solicitarAdopcion(id) {
      if(!DB.formBaseAdoptante) { alert("¡Atención! Debes llenar tu 'Formulario de Adoptante (Extendido)' en tu pestaña 'Mi Perfil' antes de solicitar una mascota."); closeMod(); switchTab('usuario','perfil'); return; }
      DB.solicitudesAdopcion.push({ idReq: Date.now(), pId: id, usuario: DB.sesionActual.nombre, form: DB.formBaseAdoptante });
      
      sincronizarDB();
      alert("Solicitud de adopción enviada con éxito. Será rigurosamente evaluada por el Administrador."); closeMod();
    }

    async function enviarAlertaCiudadana(e) {
      e.preventDefault();
      const files = getEl('al-fotos').files;
      if(files.length !== 3) { alert("¡Aviso Importante! Por protocolos de verificación, debes subir EXACTAMENTE 3 fotografías para evidenciar el caso."); return; }
      const urls = await getUrls(files);
      const fd = new FormData(e.target);
      DB.alertas.push({ dir: fd.get('direccion'), desc: fd.get('descripcion_caso') + ' | Especie: ' + fd.get('especie_cantidad'), fotos: urls });
      
      sincronizarDB();
      alert("Alerta de emergencia enviada de inmediato a todos los Rescatistas."); e.target.reset();
    }

    async function guardarFormularioAdopcion(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const fotosHogar = await getUrls(getEl('fb-fotos-hogar').files);
      DB.formBaseAdoptante = {
        ocu: fd.get('ocupacion'), sue: "S/D",
        esp: fd.get('tipo_vivienda') + " " + fd.get('tenencia'),
        tie: fd.get('horas_solo'), exp: fd.get('mascotas_anteriores'),
        vet: "N/A", fotos: fotosHogar, fullData: Object.fromEntries(fd)
      };
      
      sincronizarDB();
      getEl('fb-status').classList.remove('hidden');
      alert("Formulario Base (Extenso) guardado exitosamente. Ahora tu perfil está listo para solicitar adopciones oficiales.");
    }

    async function adminGuardarVoluntariado() {
      const idx = getEl('cms-vol-tipo').value;
      DB.cmsVoluntariado[idx].texto = getEl('cms-vol-texto').value;
      const files = getEl('cms-vol-fotos').files;
      if(files.length > 0) { const nuevasFotos = await getUrls(files); DB.cmsVoluntariado[idx].fotos.push(...nuevasFotos); }
      
      sincronizarDB();
      alert("Contenido de voluntariado actualizado. Fotos añadidas correctamente."); getEl('cms-vol-fotos').value = "";
    }

    async function adminAgregarShop(e) {
      e.preventDefault();
      const fotos = await getUrls(getEl('sh-foto').files);
      DB.shop.push({ id: Date.now(), nom: getEl('sh-nom').value, precio: getEl('sh-precio').value, desc: getEl('sh-desc').value, foto: fotos[0] });
      
      sincronizarDB();
      e.target.reset(); renderAdmin(); alert("Artículo agregado al catálogo general.");
    }

    function verLogEmpleado(rol, nombre) {
      const cont = getEl('audit-detalle');
      if(rol === 'rescatista') {
        const susR = DB.rescates.filter(r => r.rescatista === nombre);
        cont.innerHTML = `<h4 class="font-bold text-lg text-indigo-900 border-b pb-2 mb-4"><i data-lucide="shield" class="inline w-5 h-5 mr-1"></i> Registro: ${nombre}</h4>
          <div class="space-y-3 max-h-96 overflow-y-auto">
          ${susR.map(r => `
            <div class="bg-white p-4 rounded-xl border text-sm shadow-sm">
              <p class="font-bold flex justify-between text-base mb-2">Ficha Rescate #${r.id} <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold text-xs">${r.estado}</span></p>
              <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded"><strong>Ubicación:</strong> ${r.direccion}</p>${r.fotos && r.fotos[0] ? `<img src="${r.fotos[0]}" class="h-20 w-auto mt-3 rounded-lg border shadow-sm">` : ''}
            </div>
          `).join('') || '<p class="text-sm bg-white p-4 rounded-xl border text-center text-slate-500">Sin actividad registrada.</p>'}
          </div>
        `;
      } else {
        const susExp = [];
        DB.pacientes.forEach(p => { if(p.consultas) { p.consultas.forEach(c => { if(c.veterinario === nombre) susExp.push({ pId: p.id, nom: p.nombre, foto: p.foto, c }); }) } });
        cont.innerHTML = `<h4 class="font-bold text-lg text-indigo-900 border-b pb-2 mb-4"><i data-lucide="stethoscope" class="inline w-5 h-5 mr-1"></i> Registro Médico: ${nombre}</h4>
          <div class="space-y-3 max-h-96 overflow-y-auto pr-2">
          ${susExp.map(x => `
            <div class="bg-white p-4 rounded-xl border text-sm shadow-sm flex gap-4 items-center hover:bg-indigo-50 hover:border-indigo-200 transition cursor-pointer" onclick="verPerfilAdmin(${x.pId})">
              <img src="${x.foto}" class="w-14 h-14 rounded-full object-cover border-2 border-white shadow">
              <div class="w-full">
                <div class="flex justify-between items-center mb-1"><p class="font-bold text-indigo-800 text-base">Paciente #${x.pId} -${x.nom}</p><span class="text-xs text-slate-400 font-mono">${x.c.fecha}</span></div>
                <p class="text-xs text-slate-600 line-clamp-1"><strong>Diagnóstico:</strong> ${x.c.diag}</p>
                <p class="text-[10px] uppercase font-bold text-indigo-500 mt-2 text-right">Ver Perfil y Gestionar Fotos →</p>
              </div>
            </div>
          `).join('') || '<p class="text-sm bg-white p-4 rounded-xl border text-center text-slate-500">Sin actividad clínica registrada.</p>'}
          </div>
        `;
      }
      lucide.createIcons();
    }

    function verPerfilAdmin(id) {
      const p = DB.pacientes.find(x => x.id === id);
      if(!p) return;
      
      const fotoPerfilHtml = `
        <div class="relative inline-block">
          <img src="${p.foto}" class="w-32 h-32 rounded-3xl object-cover shadow-md border-4 border-white">
          <button onclick="eliminarFotoAdmin(${id}, 'perfil', null, null)" class="absolute -top-2 -right-2 bg-red-600 hover:bg-red-700 text-white p-2 rounded-full shadow-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      `;

      const consultasHtml = p.consultas && p.consultas.length > 0 ? [...p.consultas].reverse().map((c, cIndexReversed) => {
        const trueIndex = p.consultas.length - 1 - cIndexReversed;
        const fotosClinicas = c.fotos && c.fotos.length ? c.fotos.map((f, fIndex) => `
          <div class="relative inline-block mt-2">
            <img src="${f}" class="h-24 w-auto rounded-lg object-cover border shadow-sm">
            <button onclick="eliminarFotoAdmin(${id}, 'consulta', ${trueIndex}, ${fIndex})" class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-700 text-white p-1.5 rounded-full shadow transition"><i data-lucide="x" class="w-3 h-3"></i></button>
          </div>
        `).join('') : '<p class="text-xs text-slate-400 italic mt-2">Sin evidencia fotográfica médica.</p>';

        return `
          <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-sm relative mb-4">
            <div class="flex justify-between mb-3 border-b border-slate-200 pb-2"><p class="font-bold text-indigo-900 text-base"><i data-lucide="file-text" class="inline w-4 h-4 mr-1 text-indigo-400"></i> Consulta: ${c.fecha}</p><span class="text-xs text-slate-500">Atendió: ${c.veterinario}</span></div>
            <p class="text-sm"><strong>Diag:</strong> ${c.diag}</p>
            <div class="flex gap-3 flex-wrap mt-2 pt-2 border-t border-slate-100">${fotosClinicas}</div>
          </div>
        `;
      }).join('') : '<p class="text-slate-500 text-sm text-center italic bg-slate-50 p-4 rounded-xl border">Sin historial.</p>';

      openModal(`
        <div class="flex items-center justify-between mb-6 border-b pb-4">
          <h2 class="text-2xl font-black text-indigo-900 flex items-center gap-2"><i data-lucide="shield-check" class="text-emerald-500 w-8 h-8"></i> Gestión Maestra de Expediente</h2>
        </div>
        <div class="flex flex-col md:flex-row gap-8 mb-6">
          <div class="w-full md:w-1/3 text-center bg-slate-50 p-6 rounded-2xl border flex flex-col items-center">
            <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Foto de Perfil Oficial</p>
            ${fotoPerfilHtml}
            <h3 class="font-bold text-xl mt-4 text-slate-800">#${p.id} - ${p.nombre}</h3>
            <p class="text-sm text-slate-500">${p.especie}</p>
          </div>
          <div class="w-full md:w-2/3 space-y-4 max-h-96 overflow-y-auto pr-2 custom-scroll">
            <h4 class="font-bold text-lg text-slate-800 flex items-center gap-2 mb-2"><i data-lucide="camera" class="text-indigo-500"></i> Control de Fotografías Clínicas</h4>
            ${consultasHtml}
          </div>
        </div>
      `);
      lucide.createIcons();
    }

    function eliminarFotoAdmin(pId, tipo, indexConsul, indexFoto) {
      if(!confirm("¿Deseas eliminar definitivamente esta fotografía del sistema? Esta acción no se puede deshacer.")) return;
      const p = DB.pacientes.find(x => x.id === pId);
      if(tipo === 'perfil') p.foto = "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=200"; 
      else if(tipo === 'consulta') p.consultas[indexConsul].fotos.splice(indexFoto, 1);
      
      sincronizarDB();
      alert("Fotografía eliminada del expediente por el Administrador.");
      verPerfilAdmin(pId);
    }
  </script>
</body>
</html>
