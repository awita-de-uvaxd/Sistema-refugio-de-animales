{% extends "base.html" %}
{% block content %}
<div class="text-center py-12 max-w-lg mx-auto">
  <div class="bg-white p-10 rounded-3xl shadow-xl border border-slate-200">
    <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6">
      <i data-lucide="paw-print" class="w-10 h-10"></i>
    </div>
    <h2 class="text-3xl font-black text-slate-800 mb-3">Huellitas de Amor</h2>
    <p class="text-base text-slate-500 mb-8 px-4">Únete a nuestra comunidad. Adopta, reporta emergencias o gestiona el refugio de manera segura.</p>
    
    <div class="flex flex-col gap-4">
      <!-- Botón para Iniciar Sesión -->
      <a href="{{ url_for('login') }}" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-xl shadow-md transition text-lg flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-5 h-5"></i> Iniciar Sesión
      </a>
      
      <!-- Botón para Registrarse -->
      <a href="{{ url_for('registro') }}" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-md transition text-lg flex items-center justify-center gap-2">
        <i data-lucide="user-plus" class="w-5 h-5"></i> Crear Cuenta de Adoptante
      </a>
    </div>
  </div>
</div>
{% endblock %}
