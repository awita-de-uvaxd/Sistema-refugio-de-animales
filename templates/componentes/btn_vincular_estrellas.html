<style>
  .btn-stars { position: relative; padding: 12px 35px; background: #0284c7; font-size: 15px; font-weight: bold; color: white; border: 2px solid #0284c7; border-radius: 8px; transition: all 0.3s ease-in-out; cursor: pointer; width: 100%; margin-top: 1rem; }
  
  /* ARREGLOS ANTIBUG Y PROFUNDIDAD */
  .btn-stars .star { 
    position: absolute; filter: drop-shadow(0 0 0 #fffdef); z-index: 50; 
    pointer-events: none; opacity: 0; transition: all 1s cubic-bezier(0.05, 0.83, 0.43, 0.96); fill: #fffdef;
  }
  
  /* Posiciones de origen (1 al 12) */
  .btn-stars .star-1 { top: 20%; left: 20%; width: 25px; }
  .btn-stars .star-2 { top: 45%; left: 45%; width: 15px; transition: all 1s cubic-bezier(0, 0.4, 0, 1.01); }
  .btn-stars .star-3 { top: 40%; left: 40%; width: 5px; transition: all 1s cubic-bezier(0, 0.4, 0, 1.01); }
  .btn-stars .star-4 { top: 20%; left: 40%; width: 8px; transition: all 0.8s cubic-bezier(0, 0.4, 0, 1.01); }
  .btn-stars .star-5 { top: 25%; left: 45%; width: 15px; transition: all 0.6s cubic-bezier(0, 0.4, 0, 1.01); }
  .btn-stars .star-6 { top: 5%; left: 50%; width: 5px; transition: all 0.8s ease; }
  .btn-stars .star-7 { top: 30%; left: 30%; width: 12px; transition: all 0.9s cubic-bezier(0, 0.4, 0, 1.01); }
  .btn-stars .star-8 { top: 35%; left: 65%; width: 8px; transition: all 0.7s cubic-bezier(0, 0.4, 0, 1.01); }
  .btn-stars .star-9 { top: 10%; left: 30%; width: 18px; transition: all 1.1s cubic-bezier(0, 0.4, 0, 1.01); }
  .btn-stars .star-10 { top: 40%; left: 70%; width: 6px; transition: all 0.8s ease; }
  .btn-stars .star-11 { top: 20%; left: 55%; width: 14px; transition: all 0.9s cubic-bezier(0, 0.4, 0, 1.01); }
  .btn-stars .star-12 { top: 30%; left: 45%; width: 10px; transition: all 1s ease; }
  
  .btn-stars:hover { background: transparent; color: #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.5); border-color: #38bdf8; }
  .btn-stars:hover .star { opacity: 1; }
  
  /* Explosión en todas direcciones (1 al 12) */
  .btn-stars:hover .star-1 { top: -100%; left: -30%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-2 { top: -35%; left: 10%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-3 { top: 120%; left: 25%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-4 { top: 30%; left: 110%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-5 { top: 130%; left: 100%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-6 { top: -10%; left: 60%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-7 { top: -60%; left: -10%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-8 { top: -40%; left: 120%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-9 { top: 100%; left: -20%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-10 { top: 110%; left: 60%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-11 { top: -90%; left: 40%; filter: drop-shadow(0 0 10px #fffdef); }
  .btn-stars:hover .star-12 { top: 140%; left: 90%; filter: drop-shadow(0 0 10px #fffdef); }
</style>
