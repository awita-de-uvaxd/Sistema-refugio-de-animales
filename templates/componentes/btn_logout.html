<style>
  .Btn-logout {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition-duration: .3s;
    box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.199);
    background-color: rgb(239, 68, 68); /* Rojo Tailwind (red-500) para que combine */
    text-decoration: none;
  }
  
  .Btn-logout .sign {
    width: 100%;
    transition-duration: .3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .Btn-logout .sign svg {
    width: 17px;
  }
  
  .Btn-logout .sign svg path {
    fill: white;
  }
  
  .Btn-logout .text {
    position: absolute;
    right: 0%;
    width: 0%;
    opacity: 0;
    color: white;
    font-size: 13px;
    font-weight: 700;
    transition-duration: .3s;
    white-space: nowrap;
  }
  
  .Btn-logout:hover {
    width: 150px; /* Expandido para que quepa "Cerrar Sesión" */
    border-radius: 40px;
    transition-duration: .3s;
  }
  
  .Btn-logout:hover .sign {
    width: 30%;
    transition-duration: .3s;
    padding-left: 15px;
  }
  
  .Btn-logout:hover .text {
    opacity: 1;
    width: 70%;
    transition-duration: .3s;
    padding-right: 15px;
  }
  
  .Btn-logout:active {
    transform: translate(2px ,2px);
  }
</style>

<!-- Se usa <a> para que active la ruta de Flask al hacer clic -->
<a href="{{ url_for('logout') }}" class="Btn-logout">
  <div class="sign">
    <svg viewBox="0 0 512 512"><path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path></svg>
  </div>
  <div class="text">Cerrar Sesión</div>
</a>
