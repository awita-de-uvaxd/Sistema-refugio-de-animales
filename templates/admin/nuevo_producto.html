<!-- MODAL NUEVO PRODUCTO -->
<!-- MODAL NUEVO PRODUCTO CONECTADO A BASE DE DATOS -->
<div id="modal-prod" class="fixed inset-0 bg-slate-900/50 hidden z-50 flex items-center justify-center p-4">
  <form action="{{ url_for('crear_producto') }}" method="POST" enctype="multipart/form-data" class="bg-white rounded-3xl max-w-md w-full p-6 space-y-3 text-xs shadow-xl">
    <h3 class="font-black text-slate-800 border-b pb-2 text-sm">Agregar Producto</h3>
    
    <div>
      <label class="block font-bold text-slate-700 mb-1">Nombre *</label>
      <input type="text" name="nombre" placeholder="Ej. Alimento Adulto 5kg" required class="w-full p-2 border rounded-xl">
    </div>

    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="block font-bold text-slate-700 mb-1">Categoría</label>
        <select name="categoria" class="w-full p-2 border rounded-xl bg-white">
          <option value="Comida">Comida</option>
          <option value="Medicina">Medicina</option>
          <option value="Juguetes">Juguetes</option>
          <option value="Accesorios">Accesorios</option>
        </select>
      </div>
      <div>
        <label class="block font-bold text-slate-700 mb-1">Precio (Q) *</label>
        <input type="number" step="0.01" name="precio" placeholder="0.00" required class="w-full p-2 border rounded-xl">
      </div>
    </div>

    <div>
      <label class="block font-bold text-slate-700 mb-1">Stock Inicial *</label>
      <input type="number" name="stock" placeholder="10" required class="w-full p-2 border rounded-xl">
    </div>

    <div>
      <label class="block font-bold text-slate-700 mb-1">Descripción</label>
      <textarea name="descripcion" placeholder="Descripción opcional..." rows="2" class="w-full p-2 border rounded-xl"></textarea>
    </div>

    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
      <label class="block font-bold text-slate-700">Imagen del Producto</label>
      <div>
        <label class="block text-[10px] text-slate-500 mb-1">Seleccionar desde tu equipo (JPG, PNG):</label>
        <input type="file" name="foto" accept="image/*" onchange="previewImagen(event)" class="w-full text-[10px] text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-[11px] file:font-bold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 cursor-pointer">
      </div>

      <div id="p-img-preview-box" class="hidden pt-1 text-center">
        <span class="text-[10px] font-bold text-slate-400 block mb-1">Vista Previa:</span>
        <img id="p-img-preview" src="" class="w-16 h-16 object-cover rounded-xl border mx-auto shadow-sm">
      </div>
    </div>

    <div class="flex gap-2 pt-2">
      <button type="button" onclick="toggleModalProd()" class="w-1/2 py-2.5 bg-slate-100 text-slate-600 rounded-xl font-bold">Cancelar</button>
      <button type="submit" class="w-1/2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition">Guardar en Base de Datos</button>
    </div>
  </form>
</div>
