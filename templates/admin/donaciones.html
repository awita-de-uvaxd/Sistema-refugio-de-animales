<!-- inicio de donaciones -->
  <!-- Pestaña Principal 5: Gestión de Donaciones -->
  <div id="admin-donaciones" class="tab-content-main hidden">
    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm max-w-3xl">
      <h3 class="font-bold text-lg text-indigo-900 mb-4 border-b pb-2">Sección: Donaciones</h3>
      <form action="{{ url_for('editar_donacion') }}" method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Título</label>
          <input type="text" name="titulo" data-admin-regla="texto" maxlength="100" value="{{ info_donacion.titulo }}" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-indigo-600">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Subtítulo</label>
          <textarea name="subtitulo" rows="2" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-indigo-600">{{ info_donacion.subtitulo }}</textarea>
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Info Bancaria (Línea 1)</label>
          <input type="text" name="info_bancaria" data-admin-regla="texto" maxlength="200" value="{{ info_donacion.info_bancaria }}" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-indigo-600">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Nombre De</label>
          <input type="text" name="nombre_de" data-admin-regla="texto" maxlength="100" value="{{ info_donacion.nombre_de }}" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-indigo-600">
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Sede Física</label>
          <input type="text" name="sede_fisica" data-admin-regla="texto" maxlength="200" value="{{ info_donacion.sede_fisica }}" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm outline-indigo-600">
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition mt-2">Publicar Cambios Donaciones</button>
      </form>
    </div>
  </div>
<!--fin del apartado de donaciones-->
