<!-- Pestaña Principal: APARIENCIA Y TEMÁTICAS MULTIRROL -->
    <div id="admin-apariencia" class="tab-content-main hidden">
      <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm max-w-4xl mx-auto">
        
        <div class="text-center mb-8 border-b pb-6">
          <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="sparkles" class="w-8 h-8"></i></div>
          <h2 class="text-2xl font-black text-slate-800">CMS de Apariencia y Decoración</h2>
          <p class="text-sm text-slate-500 mt-1">Personaliza la plataforma de forma general o lanza mensajes específicos por rol.</p>
        </div>

        <form action="{{ url_for('editar_apariencia') }}" method="POST" enctype="multipart/form-data" class="space-y-8">
          
          <!-- SELECCIÓN DE ROL DESTINO -->
          <div class="bg-indigo-50 border-l-4 border-indigo-600 p-5 rounded-r-xl">
            <label class="block text-sm font-black text-indigo-900 mb-2">¿A quién deseas aplicarle este diseño?</label>
            <select name="rol_destino" id="select-rol" class="w-full p-3 border rounded-xl font-bold text-slate-700 outline-none cursor-pointer" onchange="toggleGlobalForzar()">
              <option value="global">Aplicar a Todos (Tema Global por Defecto)</option>
              <option value="inicio">Visitantes sin sesión (Pantallas de Login/Registro)</option>
              <option value="usuario">Solo a Adoptantes / Usuarios</option>
              <option value="rescatista">Solo a Rescatistas</option>
              <option value="veterinario">Solo a Veterinarios</option>
              <option value="admin">Solo al Administrador</option>
            </select>
            <div id="box-forzar-global" class="mt-3">
              <label class="flex items-center gap-2 cursor-pointer text-sm font-bold text-indigo-800">
                <input type="checkbox" name="forzar_global" value="si" class="w-4 h-4 accent-indigo-600">
                Forzar este tema a todos (Elimina cualquier diseño individual previo)
              </label>
            </div>
          </div>

          <!-- Textos y Color -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-6 rounded-xl border border-slate-200">
            <div class="space-y-4">
              <div><label class="block text-sm font-bold text-slate-700 mb-1">Nombre de la Plataforma</label><input type="text" name="titulo" data-admin-regla="texto" maxlength="100" placeholder="Ej. Huellitas de Amor" required class="w-full p-2.5 border rounded-xl text-sm bg-white"></div>
              <div><label class="block text-sm font-bold text-slate-700 mb-1">Eslogan / Mensaje Especial</label><input type="text" name="eslogan" data-admin-regla="texto" maxlength="100" placeholder="Ej. ¡Feliz Navidad! o Cierren el baño" required class="w-full p-2.5 border rounded-xl text-sm bg-white"></div>
            </div>
            <div class="flex flex-col items-center justify-center space-y-2">
              <label class="block text-sm font-bold text-slate-700">Color del Header</label>
              <input type="color" name="color_fondo" value="#1e1b4b" class="w-24 h-24 p-1 bg-white border rounded-2xl cursor-pointer shadow-sm">
            </div>
          </div>

          <!-- Archivos Multimedia -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Logo -->
            <div class="border border-slate-200 rounded-xl p-5 shadow-sm bg-white">
              <h4 class="font-bold text-sm text-indigo-900 mb-1"><i data-lucide="image" class="inline w-4 h-4"></i> Logotipo</h4>
              <input type="file" name="logo" accept="image/*" class="w-full text-xs text-slate-500 file:bg-indigo-50 file:text-indigo-700 file:font-bold file:border-0 file:px-3 file:py-1.5 file:rounded-lg cursor-pointer mb-4">
              <div class="border-t pt-3">
                <label class="block text-xs font-bold text-slate-700 mb-1">Tamaño del Logo</label>
                <input type="range" name="logo_size" min="30" max="150" value="45" class="w-full accent-indigo-600">
              </div>
            </div>

            <!-- Banner -->
            <div class="border border-indigo-200 rounded-xl p-5 shadow-sm bg-indigo-50/30">
              <h4 class="font-bold text-sm text-indigo-900 mb-2"><i data-lucide="clapperboard" class="inline w-4 h-4"></i> Banner Temático</h4>
              
              <div class="flex gap-2 mb-3 bg-white p-2 rounded-lg border text-xs font-bold">
                <label class="cursor-pointer"><input type="radio" name="banner_style" value="static" onchange="toggleMosaic()" class="mr-1">Estático</label>
                <label class="cursor-pointer"><input type="radio" name="banner_style" value="slideshow" onchange="toggleMosaic()" checked class="mr-1">Carrusel</label>
                <label class="cursor-pointer"><input type="radio" name="banner_style" value="mosaic" onchange="toggleMosaic()" class="mr-1">Mosaico</label>
              </div>

              <input type="file" name="banner" accept="image/*" multiple class="w-full text-xs text-slate-500 file:bg-indigo-600 file:text-white file:font-bold file:border-0 file:px-3 file:py-1.5 file:rounded-lg cursor-pointer mb-3">
              
              <div id="box-mosaic" class="hidden border-t border-indigo-100 pt-3">
                <label class="block text-xs font-bold text-indigo-900 mb-1">Tamaño del Patrón Mosaico</label>
                <input type="range" name="mosaic_size" min="50" max="400" value="150" class="w-full accent-amber-500">
              </div>
            </div>
          </div>

          <button type="submit" class="w-full bg-indigo-900 hover:bg-black text-white font-bold py-4 rounded-xl shadow-lg transition text-lg"><i data-lucide="brush" class="inline w-5 h-5 mr-2"></i> Guardar Diseño Temático</button>
        </form>
      </div>
    </div>
<!-- final de apariencia y tematicas-->
